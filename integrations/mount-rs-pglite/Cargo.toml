[package]
name = "mount-rs-pglite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "PGlite-over-PostgreSQL-wire integration for mount-rs"
license = "MIT"

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
mount-rs-persist = { path = "../mount-rs-persist" }
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
