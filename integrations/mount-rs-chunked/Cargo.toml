[package]
name = "mount-rs-chunked"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Split metadata/block chunked filesystem orchestration for mount-rs"
license = "MIT"

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
mount-rs-memory = { path = "../mount-rs-memory" }
