[package]
name = "mount-rs-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Node.js N-API bindings for mount-rs"
license = "Apache-2.0"

[features]
default = []
observability = ["dep:mount-rs-observability"]
foundationdb = ["dep:mount-rs-foundationdb", "mount-rs-foundationdb/foundationdb"]
rustls = ["mount-rs-tidb/rustls"]

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
mount-rs-9p = { path = "../../transports/mount-rs-9p" }
mount-rs-nfs = { path = "../../transports/mount-rs-nfs" }
mount-rs-s3 = { path = "../../transports/mount-rs-s3" }
mount-rs-webdav = { path = "../../transports/mount-rs-webdav" }
mount-rs-kv = { path = "../mount-rs-kv" }
mount-rs-auto = { path = "../../transports/mount-rs-auto" }
mount-rs-fuse = { path = "../../transports/mount-rs-fuse" }
mount-rs-chunked = { path = "../mount-rs-chunked" }
mount-rs-core = { path = "../.." }
mount-rs-host = { path = "../mount-rs-host" }
mount-rs-memory = { path = "../mount-rs-memory" }
mount-rs-observability = { path = "../../crates/mount-rs-observability", optional = true }
mount-rs-pglite = { path = "../mount-rs-pglite" }
mount-rs-r2 = { path = "../mount-rs-r2" }
mount-rs-sqlite = { path = "../mount-rs-sqlite" }
mount-rs-tidb = { path = "../mount-rs-tidb" }
napi = { version = "3", default-features = false, features = ["napi8", "async", "dyn-symbols", "web_stream"] }
napi-derive = "3"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "linux", target_arch = "aarch64"), all(target_os = "macos", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
mount-rs-foundationdb = { path = "../mount-rs-foundationdb", optional = true }

[build-dependencies]
napi-build = "2"
