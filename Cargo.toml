[workspace]
members = [
    ".",
    "integrations/mount-rs-persist",
    "integrations/mount-rs-memory",
    "integrations/mount-rs-host",
    "integrations/mount-rs-kv",
    "integrations/mount-rs-chunked",
    "integrations/mount-rs-fault-injection",
    "integrations/mount-rs-sqlite",
    "integrations/mount-rs-r2",
    "integrations/mount-rs-pglite",
    "integrations/mount-rs-tidb",
    "integrations/mount-rs-versioned",
    "integrations/mount-rs-sqlite-vfs",
    "integrations/mount-rs-napi",
    "transports/mount-rs-fuse",
    "transports/mount-rs-9p",
    "transports/mount-rs-nfs",
    "transports/mount-rs-webdav",
    "transports/mount-rs-s3",
    "transports/mount-rs-auto",
    "crates/mount-rs-cli",
    "crates/mount-rs-http",
]
resolver = "3"

[package]
name = "mount-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Core Rust filesystem driver contract and memory filesystem for mountx"
license = "Apache-2.0"
repository = "https://github.com/andymac4182/mount-rs"
readme = "README.md"
keywords = ["filesystem", "mount", "memfs", "r2", "pglite"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
mount-rs-9p = { path = "transports/mount-rs-9p" }
mount-rs-s3 = { path = "transports/mount-rs-s3" }
mount-rs-webdav = { path = "transports/mount-rs-webdav" }
mount-rs-kv = { path = "integrations/mount-rs-kv" }
mount-rs-auto = { path = "transports/mount-rs-auto" }
mount-rs-host = { path = "integrations/mount-rs-host" }
mount-rs-nfs = { path = "transports/mount-rs-nfs" }
mount-rs-memory = { path = "integrations/mount-rs-memory" }
mount-rs-chunked = { path = "integrations/mount-rs-chunked" }
mount-rs-fuse = { path = "transports/mount-rs-fuse" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
mount-rs-r2 = { path = "integrations/mount-rs-r2" }
mount-rs-pglite = { path = "integrations/mount-rs-pglite" }
mount-rs-persist = { path = "integrations/mount-rs-persist" }
mount-rs-sqlite = { path = "integrations/mount-rs-sqlite" }
object_store = { version = "0.12", features = ["aws"] }
tempfile = "3"
