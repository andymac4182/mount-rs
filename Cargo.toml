[workspace]
members = [
    ".",
    "filesystems/mount-rs-memfs",
    "filesystems/mount-rs-persist",
    "filesystems/mount-rs-sqlite-fs",
    "filesystems/mount-rs-pglite-fs",
    "filesystems/mount-rs-r2-fs",
    "providers/mount-rs-memory",
    "filesystems/mount-rs-host",
    "filesystems/mount-rs-kv",
    "filesystems/mount-rs-chunked",
    "crates/mount-rs-fault-injection",
    "providers/mount-rs-sqlite",
    "providers/mount-rs-r2",
    "providers/mount-rs-rustfs",
    "providers/mount-rs-object-store-blocks",
    "providers/mount-rs-aws-s3",
    "providers/mount-rs-pglite",
    "providers/mount-rs-foundationdb",
    "providers/mount-rs-tidb",
    "filesystems/mount-rs-versioned",
    "bindings/mount-rs-sqlite-vfs",
    "bindings/mount-rs-napi",
    "crates/mount-rs-observability",
    "transports/mount-rs-fuse",
    "transports/mount-rs-9p",
    "transports/mount-rs-nfs",
    "transports/mount-rs-webdav",
    "transports/mount-rs-s3",
    "transports/mount-rs-auto",
    "apps/mount-rs-cli",
    "crates/mount-rs-sdk",
    "crates/mount-rs-blob-cache",
    "transports/mount-rs-http",
    "crates/mount-rs-service",
    "crates/mount-rs-remote-protocol",
    "crates/mount-rs-remote-client",
]
resolver = "3"

# Rust 1.95 can emit a misaligned LINKEDIT string pool when stripping the
# macOS N-API cdylib; dyld on macOS 27 then refuses to load the addon.
[profile.release.package.mount-rs-napi]
strip = "none"

[package]
name = "mount-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Core Rust filesystem driver and storage contracts for mountx"
license = "Apache-2.0"
repository = "https://github.com/andymac4182/mount-rs"
readme = "README.md"
keywords = ["filesystem", "mount", "driver", "storage"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mount-rs-memfs = { path = "filesystems/mount-rs-memfs" }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
mount-rs-9p = { path = "transports/mount-rs-9p" }
mount-rs-s3 = { path = "transports/mount-rs-s3" }
mount-rs-webdav = { path = "transports/mount-rs-webdav" }
mount-rs-kv = { path = "filesystems/mount-rs-kv" }
mount-rs-auto = { path = "transports/mount-rs-auto" }
mount-rs-host = { path = "filesystems/mount-rs-host" }
mount-rs-nfs = { path = "transports/mount-rs-nfs" }
mount-rs-memory = { path = "providers/mount-rs-memory" }
mount-rs-chunked = { path = "filesystems/mount-rs-chunked" }
mount-rs-fuse = { path = "transports/mount-rs-fuse" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
mount-rs-r2 = { path = "providers/mount-rs-r2" }
mount-rs-aws-s3 = { path = "providers/mount-rs-aws-s3" }
mount-rs-r2-fs = { path = "filesystems/mount-rs-r2-fs" }
mount-rs-pglite = { path = "providers/mount-rs-pglite" }
mount-rs-pglite-fs = { path = "filesystems/mount-rs-pglite-fs" }
mount-rs-persist = { path = "filesystems/mount-rs-persist" }
mount-rs-sqlite = { path = "providers/mount-rs-sqlite" }
mount-rs-sqlite-fs = { path = "filesystems/mount-rs-sqlite-fs" }
object_store = { version = "0.12", features = ["aws"] }
tempfile = "3"
