[package]
name = "mount-rs-foundationdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "FoundationDB integration for mount-rs"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
# Keep the native FoundationDB client out of ordinary workspace builds. The
# provider is real when this feature is enabled; the feature-off package is
# intentionally only a portable workspace shell, not a backend.
default = []
foundationdb = [
    "dep:async-trait",
    "dep:foundationdb",
    "dep:futures-util",
    "dep:mount-rs-core",
    "dep:serde_json",
    "dep:sha2",
    "dep:tracing",
    "dep:uuid",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
mount-rs-core = { path = "../..", optional = true }
sha2 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "linux", target_arch = "aarch64"), all(target_os = "macos", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
foundationdb = { version = "0.11.0", optional = true, default-features = false, features = ["embedded-fdb-include", "fdb-7_4"] }

[dev-dependencies]
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[[test]]
name = "foundationdb"
path = "tests/foundationdb.rs"
required-features = ["foundationdb"]

[[test]]
name = "network_shutdown"
path = "tests/network_shutdown.rs"
required-features = ["foundationdb"]

[[test]]
name = "block_preflight"
path = "tests/block_preflight.rs"
required-features = ["foundationdb"]

[[test]]
name = "delegation"
path = "tests/delegation.rs"
required-features = ["foundationdb"]
