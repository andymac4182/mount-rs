[package]
name = "mount-rs-rustfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "RustFS S3-compatible immutable block provider for mount-rs"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
mount-rs-object-store-blocks = { path = "../mount-rs-object-store-blocks" }
object_store = { version = "0.12", default-features = false, features = ["aws"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
