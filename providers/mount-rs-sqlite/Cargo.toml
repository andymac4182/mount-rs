[package]
name = "mount-rs-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SQLite integration for mount-rs"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
async-io = "2.6"
async-trait = "0.1"
mount-rs-core = { path = "../.." }
mount-rs-persist = { path = "../../filesystems/mount-rs-persist" }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-lite = "2"
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
tempfile = "3"
