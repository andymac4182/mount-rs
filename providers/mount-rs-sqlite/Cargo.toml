[package]
name = "mount-rs-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SQLite integration for mount-rs"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
mount-rs-persist = { path = "../../filesystems/mount-rs-persist" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
