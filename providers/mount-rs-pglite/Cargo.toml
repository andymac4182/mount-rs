[package]
name = "mount-rs-pglite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "PGlite-over-PostgreSQL-wire integration for mount-rs"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
async-trait = "0.1"
md-5 = "0.10"
mount-rs-core = { path = "../.." }
mount-rs-persist = { path = "../../filesystems/mount-rs-persist" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
mount-rs-versioned = { path = "../../filesystems/mount-rs-versioned" }
