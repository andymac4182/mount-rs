[package]
name = "mount-rs-blob-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
[dependencies]
mount-rs-core = { path = "../.." }
async-trait = "0.1"
sha2 = "0.10"
md-5 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time", "macros"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
[dev-dependencies]
tempfile = "3"
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
