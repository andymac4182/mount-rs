[package]
name = "mount-rs-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[features]
saturation-foundationdb = ["mount-rs-sdk/foundationdb"]

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
mount-rs-remote-protocol = { path = "../mount-rs-remote-protocol" }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
base64 = "0.22"
ring = "0.17"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
mount-rs-sdk = { path = "../mount-rs-sdk" }
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
mount-rs-tidb = { path = "../../providers/mount-rs-tidb" }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
