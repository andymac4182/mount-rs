[package]
name = "mount-rs-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Public Rust SDK for constructing and using mount-rs filesystems"
license = "Apache-2.0"
repository = "https://github.com/andymac4182/mount-rs"
readme = "README.md"

[features]
default = []
observability = ["dep:mount-rs-observability"]
foundationdb = ["dep:mount-rs-foundationdb", "mount-rs-foundationdb/foundationdb"]
rustls = ["mount-rs-tidb/rustls"]

[dependencies]
async-trait = "0.1"
mount-rs-auto = { path = "../../transports/mount-rs-auto" }
mount-rs-chunked = { path = "../../integrations/mount-rs-chunked" }
mount-rs-core = { path = "../.." }
mount-rs-host = { path = "../../integrations/mount-rs-host" }
mount-rs-memory = { path = "../../integrations/mount-rs-memory" }
mount-rs-observability = { path = "../mount-rs-observability", optional = true }
mount-rs-pglite = { path = "../../integrations/mount-rs-pglite" }
mount-rs-r2 = { path = "../../integrations/mount-rs-r2" }
mount-rs-sqlite = { path = "../../integrations/mount-rs-sqlite" }
mount-rs-tidb = { path = "../../integrations/mount-rs-tidb" }

[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "linux", target_arch = "aarch64"), all(target_os = "macos", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
mount-rs-foundationdb = { path = "../../integrations/mount-rs-foundationdb", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
