[package]
name = "mount-rs-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Multi-drive HTTP transport for mount-rs filesystem drivers"
license = "Apache-2.0"
repository = "https://github.com/andymac4182/mount-rs"

[features]
default = []
observability = ["dep:mount-rs-observability"]
observability-otlp = [
    "observability",
    "mount-rs-observability/http-propagation",
]

[dependencies]
bytes = "1"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
mount-rs-core = { path = "../.." }
mount-rs-observability = { path = "../mount-rs-observability", optional = true }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
mount-rs-sqlite = { path = "../../integrations/mount-rs-sqlite" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["io-util"] }
