name: Production Target Evidence Probe

on:
  push:
    branches:
      - 'codex/full-target-evidence-probe-20260930-1106'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bind current lossless verifier and tests
        run: |
          test ! -e scripts/verify-production-target-evidence.py
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'scripts/bench-remote-production-target.sh': '0efdb61e418cfea266b742859d7a573dcef901e74098771cd3330415d5f96a9b',
              'scripts/test-production-target-evidence.py': '0e9c4badb97667f6926889abe8d1977d9f95601b04dde23ac331a13102b0b9ff',
          }
          for path, digest in expected.items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise SystemExit('source identity mismatch: ' + path)
          PY
      - name: Verify geometry fix and all retained receipt controls
        timeout-minutes: 1
        run: python3 -B scripts/test-production-target-evidence.py
