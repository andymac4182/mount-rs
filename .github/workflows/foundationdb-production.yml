name: W07 FoundationDB production qualification

on:
  workflow_dispatch:

permissions:
  contents: read

# The repository-wide CI workflow cancels long provider jobs whenever another
# workstream pushes to main. Keep this explicit W07 qualification run stable so
# its terminal result can be retained in the production evidence packet.
concurrency:
  group: w07-foundationdb-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundationdb-rustfs:
    name: Durable FoundationDB, RustFS, Node, CLI, and restart qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Verify W07 rollout ledger remains internally consistent
        run: node scripts/verify-w07-rollout-ledger.mjs

      - name: Test W07 rollout ledger fail-closed cases
        run: node scripts/test-w07-rollout-ledger.mjs

      - name: Verify W07 production config policy without credentials or network
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/verify-w07-production-config.mjs \
            tests/foundationdb/production-config-policy.json \
            2>&1 | tee artifacts/foundationdb-production-qualification.log
          if node scripts/verify-w07-production-config.mjs \
            tests/foundationdb/production-config-policy.invalid.json \
            2>&1 | tee -a artifacts/foundationdb-production-qualification.log; then
            echo 'W07 production config policy accepted an insecure fixture' >&2
            exit 1
          fi

      - name: Install real PGlite and Node factory prerequisites
        run: |
          pnpm --dir tests/pglite install --frozen-lockfile
          pnpm --dir integrations/mount-rs-napi install --frozen-lockfile

      - name: Build the default N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir integrations/mount-rs-napi build

      - name: Install and verify the Linux FUSE prerequisite for the FDB CLI gate
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          command -v fusermount3

      - name: Verify durable FoundationDB metadata, RustFS chunks, and restart
        env:
          RUSTFS_COMBO_NAME: foundationdb-production-qualification
          RUSTFS_COMBO_TIMEOUT_SECONDS: '900'
          RUSTFS_COMBO_COMMAND: ./scripts/test-foundationdb.sh
          MOUNT_RS_FOUNDATIONDB_TOPOLOGY: durable
          # Five isolated real-provider rounds give the dedicated production
          # qualification lane a bounded soak signal without presenting it as
          # a production-duration or capacity result.
          MOUNT_RS_FOUNDATIONDB_SOAK_ROUNDS: '5'
          MOUNT_RS_FOUNDATIONDB_NAPI: '1'
          MOUNT_RS_FOUNDATIONDB_NATIVE_CLI: '1'
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./scripts/test-rustfs.sh 2>&1 | tee -a artifacts/foundationdb-production-qualification.log

      - name: Validate W07 qualification evidence markers
        if: success()
        env:
          W07_REQUIRE_PROVENANCE: '1'
          W07_QUALIFICATION_REPOSITORY: ${{ github.repository }}
          W07_QUALIFICATION_WORKFLOW: ${{ github.workflow }}
          W07_QUALIFICATION_REF: ${{ github.ref }}
          W07_QUALIFICATION_SOURCE_REVISION: ${{ github.sha }}
          W07_QUALIFICATION_RUN_ID: ${{ github.run_id }}
          W07_QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          W07_QUALIFICATION_RUNNER: ${{ runner.name }}
        run: |
          set -o pipefail
          node scripts/verify-w07-qualification-log.mjs \
            artifacts/foundationdb-production-qualification.log \
            5 \
            artifacts/foundationdb-production-qualification-summary.json \
            2>&1 | tee -a artifacts/foundationdb-production-qualification.log

      - name: Preserve W07 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundationdb-production-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/foundationdb-production-qualification.log
            artifacts/foundationdb-production-qualification-summary.json
          if-no-files-found: warn
