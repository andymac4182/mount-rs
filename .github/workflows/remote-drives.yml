name: Remote Drives
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - run: ./scripts/cargo-shared test --locked -p mount-rs-service -p mount-rs-remote-protocol -p mount-rs-remote-client -p mount-rs-cli
      - run: ./scripts/cargo-shared clippy --locked -p mount-rs-service -p mount-rs-remote-protocol -p mount-rs-remote-client -p mount-rs-cli --all-targets -- -D warnings
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Build the native qualification test
        run: CARGO_TARGET_DIR=/tmp/mount-rs-remote-target ./scripts/cargo-shared test --locked -p mount-rs-remote-client --test quic_mount --no-run
      - name: Qualify two Drives through the existing Linux NFS adapter
        run: sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_TARGET_DIR=/tmp/mount-rs-remote-target MOUNT_RS_REMOTE_NATIVE_NFS=1 ./scripts/cargo-shared test --locked -p mount-rs-remote-client --test quic_mount -- --nocapture
