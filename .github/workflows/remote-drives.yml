name: Remote Drives
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tidb_saturation:
        description: Run the release-mode TiDB Drive saturation benchmark
        type: boolean
        default: false
      native_qualification:
        description: Run signed CLI and supervised ten-process SQLite cache qualification
        type: boolean
        default: false
      production_target:
        description: Attempt the unchanged full 10000-client SQLite production target
        type: boolean
        default: false
      owned_backing_pilot:
        description: Run the owned durable TiDB and RustFS native backing pilot
        type: boolean
        default: false
      formal_qualification:
        description: Run all committed named Kani proof runners with retained per-harness results
        type: boolean
        default: false
      owned_engine_socket:
        description: Explicit owned backing pilot Engine socket; requires /var/run/docker.sock
        type: string
        default: ''
permissions:
  contents: read
jobs:
  protocol:
    if: github.event_name != 'workflow_dispatch' || !(inputs.native_qualification || inputs.production_target || inputs.owned_backing_pilot || inputs.formal_qualification)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          components: clippy
      - name: Verify bounded startup and live progress controls
        run: python3 -B scripts/test-filter-startup-diagnostics.py
      - run: ./scripts/cargo-shared test --locked -p mount-rs-service -p mount-rs-remote-protocol -p mount-rs-remote-client -p mount-rs-cli
      - run: ./scripts/cargo-shared clippy --locked -p mount-rs-service -p mount-rs-remote-protocol -p mount-rs-remote-client -p mount-rs-cli --all-targets -- -D warnings
      - name: Run bounded QUIC soak
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/test-quic-load.sh soak > remote-quic-soak.log 2>&1
      - name: Retain soak results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-quic-soak-${{ matrix.os }}
          path: remote-quic-soak.log
  native-linux:
    if: github.event_name != 'workflow_dispatch' || !(inputs.native_qualification || inputs.production_target || inputs.owned_backing_pilot || inputs.formal_qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Build the native qualification test
        run: CARGO_TARGET_DIR=/tmp/mount-rs-remote-target ./scripts/cargo-shared test --locked -p mount-rs-remote-client --test quic_mount --no-run
      - name: Qualify two Drives through the existing Linux NFS adapter
        run: sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_TARGET_DIR=/tmp/mount-rs-remote-target MOUNT_RS_REMOTE_NATIVE_NFS=1 ./scripts/cargo-shared test --locked -p mount-rs-remote-client --test quic_mount -- --nocapture
  formal:
    if: github.event_name != 'workflow_dispatch' || !(inputs.native_qualification || inputs.production_target || inputs.owned_backing_pilot || inputs.formal_qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Install Kani and verify handle admission
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237
        with:
          kani-version: '0.68.0'
          args: '-p mount-rs-service --harness remote_handle_admission_is_fenced_and_bounded'
      - name: Verify each remote decision separately
        run: ./scripts/verify-remote-formal
  tidb-scale:
    if: github.event_name == 'workflow_dispatch' && !(inputs.native_qualification || inputs.production_target || inputs.owned_backing_pilot || inputs.formal_qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Run 100 clients against 10 servers on replicated TiDB
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-remote-tidb-target
        run: ./scripts/test-remote-tidb.sh cluster > remote-tidb-scale.log 2>&1
      - name: Retain TiDB scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-tidb-scale
          path: remote-tidb-scale.log
  tidb-saturation:
    if: github.event_name == 'workflow_dispatch' && inputs.tidb_saturation && !(inputs.native_qualification || inputs.production_target || inputs.owned_backing_pilot || inputs.formal_qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Measure read and write saturation on replicated TiDB
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-remote-tidb-target
          MOUNT_RS_REMOTE_TIDB_SATURATION_OUTPUT: remote-tidb-saturation.json
        run: ./scripts/bench-remote-tidb.sh cluster > remote-tidb-saturation.log 2>&1
      - name: Retain saturation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-tidb-saturation
          path: |
            remote-tidb-saturation.log
            remote-tidb-saturation*.json
  native-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.native_qualification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        lane: [signed-default, signed-profiled, cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      QUALIFICATION_LANE: ${{ matrix.lane }}
      MOUNT_RS_TEN_PROCESS_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Bind clean source and select one native test
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mount-rs-native-target-$QUALIFICATION_LANE"
          export EVIDENCE_DIR="$RUNNER_TEMP/mount-rs-native-evidence-$QUALIFICATION_LANE"
          export MOUNT_RS_TEN_PROCESS_OUTPUT="$RUNNER_TEMP/mount-rs-cache-private"
          printf 'CARGO_TARGET_DIR=%s\nEVIDENCE_DIR=%s\nMOUNT_RS_TEN_PROCESS_OUTPUT=%s\n' "$CARGO_TARGET_DIR" "$EVIDENCE_DIR" "$MOUNT_RS_TEN_PROCESS_OUTPUT" >> "$GITHUB_ENV"
          mkdir -m 700 "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/checkout-sha.txt"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/source-before.txt"
          test ! -s "$EVIDENCE_DIR/source-before.txt"
          case "$QUALIFICATION_LANE" in
            signed-default) features=local-oidc-fixture; target=configured_remote_compact; selected=configured_binary_selects_mrc5_for_signed_quic_and_websocket_reopen ;;
            signed-profiled) features=io-profiling,local-oidc-fixture; target=configured_remote_compact; selected=configured_binary_selects_mrc5_for_signed_quic_and_websocket_reopen ;;
            cache) features=local-oidc-fixture; target=ten_process_cache; selected=ten_process_sqlite_cache_qualification ;;
            *) exit 2 ;;
          esac
          printf 'QUALIFICATION_FEATURES=%s\nQUALIFICATION_TARGET=%s\nQUALIFICATION_TEST=%s\n' "$features" "$target" "$selected" >> "$GITHUB_ENV"
      - name: Build the exact debug native test and retain binary identity
        run: |
          set -euo pipefail
          ./scripts/cargo-shared test --locked -p mount-rs-cli --features "$QUALIFICATION_FEATURES" \
            --test "$QUALIFICATION_TARGET" --no-run --message-format=json \
            > "$EVIDENCE_DIR/build.jsonl" 2> "$EVIDENCE_DIR/build.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          artifacts = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()]
          tests = [v for v in artifacts if v.get('reason') == 'compiler-artifact' and v['target']['name'] == os.environ['QUALIFICATION_TARGET'] and v.get('executable') and v['profile']['test']]
          if len(tests) != 1: raise SystemExit('exact native test executable identity unavailable')
          digest = lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          receipt = {'checkout_sha': (root / 'checkout-sha.txt').read_text().strip(), 'features': tests[0]['features'], 'debug_assertions': tests[0]['profile']['debug_assertions'], 'test_sha256': digest(tests[0]['executable']), 'cli_sha256': digest(pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'debug/mount-rs')}
          if receipt['debug_assertions'] is not True: raise SystemExit('debug native fixture required')
          (root / 'build-receipt.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY
      - name: Run one exact signed test or the existing cache supervisor
        run: |
          set -euo pipefail
          unset MOUNT_RS_PROFILE_IO MOUNT_RS_TRACE_SERVICE MOUNT_RS_TRACE_STORAGE
          args=(--exact --nocapture --test-threads=1)
          if [ "$QUALIFICATION_LANE" = cache ]; then args+=(--ignored); fi
          status=0
          ./scripts/cargo-shared test --locked -p mount-rs-cli --features "$QUALIFICATION_FEATURES" \
            --test "$QUALIFICATION_TARGET" "$QUALIFICATION_TEST" -- "${args[@]}" \
            > "$EVIDENCE_DIR/native.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$EVIDENCE_DIR/native-exit-code.txt"
          cat "$EVIDENCE_DIR/native.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          log = (root / 'native.log').read_text()
          selected = re.escape(os.environ['QUALIFICATION_TEST'])
          if not re.search(r'(?ms)^test ' + selected + r' \.\.\. .*?\bok\s*$', log) or not re.search(r'^test result: ok\. 1 passed; 0 failed; 0 ignored;', log, re.M):
              raise SystemExit('one exact native test must execute and pass; zero tests cannot qualify')
          if os.environ['QUALIFICATION_LANE'] == 'cache':
              private = pathlib.Path(os.environ['MOUNT_RS_TEN_PROCESS_OUTPUT'])
              receipt = json.loads((private / 'receipt.json').read_text())
              controller = json.loads((private / 'controller.json').read_text())
              build = json.loads((root / 'build-receipt.json').read_text())
              if receipt.get('complete') is not True or receipt.get('owned_cleanup_closed') is not True or controller.get('forced') is not False or controller.get('failure') is not None:
                  raise SystemExit('cache qualification or owned cleanup incomplete')
              if not all(controller.get(k) is True for k in ['worker_reaped', 'worker_success', 'group_gone', 'unrelated_sentinel_retained', 'resource_initial_observed']) or controller.get('resource_sample_count', 0) <= 0:
                  raise SystemExit('cache supervisor ownership or resource evidence incomplete')
              if controller['test_binary_sha256'] != build['test_sha256'] or controller['cli_binary_sha256'] != build['cli_sha256']:
                  raise SystemExit('cache runtime binary identity differs from build')
          PY
      - name: Retain controlled cache receipts and final source state
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/source-after.txt"
          python3 - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['MOUNT_RS_TEN_PROCESS_OUTPUT'])
          destination = pathlib.Path(os.environ['EVIDENCE_DIR'])
          for name in ['controller.json', 'receipt.json', 'resource.json', 'resource-initial.json', 'stop.json']:
              path = source / name
              if path.is_file() and not path.is_symlink(): shutil.copyfile(path, destination / name)
          PY
          test ! -s "$EVIDENCE_DIR/source-after.txt"
      - name: Retain native qualification evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-native-${{ matrix.os }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
  production-target:
    if: github.event_name == 'workflow_dispatch' && inputs.production_target
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      MOUNT_RS_TARGET_MODE: full
      MOUNT_RS_TARGET_PROVIDER: sqlite
      MOUNT_RS_TARGET_DRIVES: '10000'
      MOUNT_RS_TARGET_FILES: '1000'
      MOUNT_RS_TARGET_SECONDS: '30'
      MOUNT_RS_PROFILE_IO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Build full target from clean source and bind executable identity
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mount-rs-full-target"
          export EVIDENCE_DIR="$RUNNER_TEMP/mount-rs-full-evidence"
          export MOUNT_RS_TARGET_OUTPUT="$RUNNER_TEMP/mount-rs-full-output"
          printf 'CARGO_TARGET_DIR=%s\nEVIDENCE_DIR=%s\nMOUNT_RS_TARGET_OUTPUT=%s\n' "$CARGO_TARGET_DIR" "$EVIDENCE_DIR" "$MOUNT_RS_TARGET_OUTPUT" >> "$GITHUB_ENV"
          mkdir -m 700 "$EVIDENCE_DIR"
          test ! -e "$MOUNT_RS_TARGET_OUTPUT"
          git rev-parse HEAD > "$EVIDENCE_DIR/checkout-sha.txt"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/source-before.txt"
          test ! -s "$EVIDENCE_DIR/source-before.txt"
          python3 -B scripts/test-filter-startup-diagnostics.py
          ./scripts/cargo-shared test --locked -p mount-rs-service --features resource-profiling \
            --test quic_production_target --no-run --message-format=json \
            > "$EVIDENCE_DIR/build.jsonl" 2> "$EVIDENCE_DIR/build.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          artifacts = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()]
          tests = [v for v in artifacts if v.get('reason') == 'compiler-artifact' and v['target']['name'] == 'quic_production_target' and v.get('executable') and v['profile']['test']]
          if len(tests) != 1: raise SystemExit('exact production target executable identity unavailable')
          receipt = {'checkout_sha': (root / 'checkout-sha.txt').read_text().strip(), 'features': tests[0]['features'], 'test_sha256': hashlib.sha256(pathlib.Path(tests[0]['executable']).read_bytes()).hexdigest(), 'diagnostics_filter_sha256': hashlib.sha256(pathlib.Path('scripts/filter-startup-diagnostics.py').read_bytes()).hexdigest()}
          (root / 'build-receipt.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY
      - name: Attempt the unchanged full target without a smaller fallback
        run: |
          set -euo pipefail
          unset MOUNT_RS_TARGET_INJECT MOUNT_RS_TRACE_STORAGE
          umask 077
          private_log_dir="$RUNNER_TEMP/mount-rs-full-private"
          mkdir -m 700 "$private_log_dir"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          build = json.loads((pathlib.Path(os.environ['EVIDENCE_DIR']) / 'build-receipt.json').read_text())
          if hashlib.sha256(pathlib.Path('scripts/filter-startup-diagnostics.py').read_bytes()).hexdigest() != build['diagnostics_filter_sha256']:
              raise SystemExit('diagnostics filter differs from clean build')
          PY
          set +e
          ./scripts/bench-remote-production-target.sh 2>&1 \
            | python3 -B scripts/filter-startup-diagnostics.py \
                --private-log "$private_log_dir/production-target.log" \
                --require-target-identity \
                --expected-source-revision "$(cat "$EVIDENCE_DIR/checkout-sha.txt")" \
                --expected-mode "$MOUNT_RS_TARGET_MODE" \
                --expected-provider "$MOUNT_RS_TARGET_PROVIDER" \
                --expected-servers 10 --expected-clients 10000 --expected-drives "$MOUNT_RS_TARGET_DRIVES" \
                --expected-partitions 5000 --expected-files-per-drive "$MOUNT_RS_TARGET_FILES" \
                --expected-phase-seconds "$MOUNT_RS_TARGET_SECONDS" \
            | tee "$EVIDENCE_DIR/production-target-progress.log"
          pipeline_status=( "${PIPESTATUS[@]}" )
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$EVIDENCE_DIR/production-target-exit-code.txt"
          printf '%s\n' "${pipeline_status[1]}" > "$EVIDENCE_DIR/diagnostics-filter-exit-code.txt"
          printf '%s\n' "${pipeline_status[2]}" > "$EVIDENCE_DIR/diagnostics-log-exit-code.txt"
          if [ "${pipeline_status[0]}" -ne 0 ]; then exit "${pipeline_status[0]}"; fi
          if [ "${pipeline_status[1]}" -ne 0 ]; then exit "${pipeline_status[1]}"; fi
          if [ "${pipeline_status[2]}" -ne 0 ]; then exit "${pipeline_status[2]}"; fi
          export MOUNT_RS_TARGET_PRIVATE_LOG="$private_log_dir/production-target.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          log = pathlib.Path(os.environ['MOUNT_RS_TARGET_PRIVATE_LOG']).read_text()
          if not re.search(r'(?ms)^test production_target_controller \.\.\. .*?\bok\s*$', log) or not re.search(r'^test result: ok\. 1 passed; 0 failed; 0 ignored;', log, re.M): raise SystemExit('full controller must execute and pass exactly once')
          terminal = json.loads((pathlib.Path(os.environ['MOUNT_RS_TARGET_OUTPUT']) / 'terminal.json').read_text())
          build = json.loads((root / 'build-receipt.json').read_text())
          if hashlib.sha256(pathlib.Path('scripts/filter-startup-diagnostics.py').read_bytes()).hexdigest() != build['diagnostics_filter_sha256']:
              raise SystemExit('diagnostics filter differs from clean build')
          if terminal['source']['binary_sha256'] != build['test_sha256'] or terminal['source']['revision'] != build['checkout_sha'] or terminal['source']['checkout_status']:
              raise SystemExit('full runtime source or binary identity differs from clean build')
          PY
      - name: Verify final source state
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/source-after.txt"
          test ! -s "$EVIDENCE_DIR/source-after.txt"
      - name: Retain sanitized target progress and public receipts even on preflight failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-full-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_DIR }}
            ${{ env.MOUNT_RS_TARGET_OUTPUT }}/*.json
            ${{ env.MOUNT_RS_TARGET_OUTPUT }}/metrics/*.json
            ${{ env.MOUNT_RS_TARGET_OUTPUT }}/expected/*.json
            ${{ env.MOUNT_RS_TARGET_OUTPUT }}/worker-*/*.json
            ${{ env.MOUNT_RS_TARGET_OUTPUT }}/worker-*/metrics/*.json
          if-no-files-found: error
          retention-days: 14
  owned-backing-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.owned_backing_pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      OWNED_ENGINE_SOCKET: ${{ inputs.owned_engine_socket }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11
      - name: Require explicit local Engine and create private capability
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mount-rs-pilot-target"
          export PILOT_PRIVATE="$RUNNER_TEMP/mount-rs-owned-pilot"
          printf 'CARGO_TARGET_DIR=%s\nPILOT_PRIVATE=%s\n' "$CARGO_TARGET_DIR" "$PILOT_PRIVATE" >> "$GITHUB_ENV"
          test "$OWNED_ENGINE_SOCKET" = /var/run/docker.sock
          test -S "$OWNED_ENGINE_SOCKET"
          umask 077
          mkdir -m 700 "$PILOT_PRIVATE"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['PILOT_PRIVATE']) / 'engine.json'
          with path.open('x') as file: json.dump({'socket_path': os.environ['OWNED_ENGINE_SOCKET']}, file)
          path.chmod(0o600)
          PY
      - name: Install the public Node SDK test addon
        run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build one locked release addon outside the clean checkout
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          napi_stage="$RUNNER_TEMP/mount-rs-pilot-napi-stage"
          mkdir -m 700 "$napi_stage"
          status=0
          pnpm --dir bindings/mount-rs-napi exec napi build \
            --platform --release --no-js --output-dir "$napi_stage" -- --locked \
            > "$PILOT_PRIVATE/build.log" 2>&1 || status=$?
          printf 'Owned backing pilot addon build exit status: %s\n' "$status"
          if [ "$status" -ne 0 ]; then cat "$PILOT_PRIVATE/build.log"; exit "$status"; fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          export NAPI_STAGE="$napi_stage"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          candidates = list(pathlib.Path(os.environ['NAPI_STAGE']).glob('*.node'))
          if len(candidates) != 1 or not candidates[0].is_file() or candidates[0].is_symlink(): raise SystemExit('exactly one staged native addon required')
          sources = ['scripts/test-rustfs.sh', 'scripts/test-tidb.sh', 'benchmarks/storage/runner.mjs', 'benchmarks/storage/owned-backing-pilot.mjs', 'benchmarks/storage/owned-backing-pilot.test.mjs', 'benchmarks/storage/README.md']
          digest = lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          receipt = {'schema': 'mount-rs.hosted-native-build.v1', 'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'source_clean': True, 'locked': True, 'release': True, 'no_js': True, 'build_exit_code': 0, 'native_sha256': digest(candidates[0]), 'source_sha256': {p: digest(p) for p in sources}}
          (pathlib.Path(os.environ['PILOT_PRIVATE']) / 'build.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as file: file.write('NAPI_RS_NATIVE_LIBRARY_PATH=' + str(candidates[0]) + '\n')
          PY
      - name: Observe selected Engine capacity and run the fixed owned pilot
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_TLS DOCKER_TLS_VERIFY DOCKER_CERT_PATH NAPI_RS_FORCE_WASI NAPI_RS_WASI_FLAVOR NODE_PATH NODE_OPTIONS
          unset MOUNT_RS_TRACE_STORAGE MOUNT_RS_TRACE_SERVICE MOUNT_RS_RUSTFS_COMBO_TRACE
          unset MOUNT_RS_TIDB_URL TIDB_URL MOUNT_RS_R2_ENDPOINT R2_ENDPOINT MOUNT_RS_R2_BUCKET R2_BUCKET
          unset MOUNT_RS_R2_ACCESS_KEY_ID R2_ACCESS_KEY_ID MOUNT_RS_R2_SECRET_ACCESS_KEY R2_SECRET_ACCESS_KEY
          unset MOUNT_RS_R2_REGION R2_REGION MOUNT_RS_R2_SESSION_TOKEN R2_SESSION_TOKEN MOUNT_RS_TIDB_TLS_URL MOUNT_RS_TIDB_DOCKER_PLATFORM
          unset MOUNT_RS_TIDB_COMPOSITION_COMMAND MOUNT_RS_TIDB_NODE_PREFIX MOUNT_RS_TIDB_RUSTFS_PREFIX
          export DOCKER_HOST="unix://$OWNED_ENGINE_SOCKET"
          status=0
          python3 scripts/rustfs-bounded-docker.py 30 hosted-capacity docker info --format '{{.MemTotal}} {{.NCPU}}' \
            > "$PILOT_PRIVATE/capacity.txt" 2> "$PILOT_PRIVATE/capacity.log" || status=$?
          export CAPACITY_EXIT_CODE="$status"
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['PILOT_PRIVATE'])
          status = int(os.environ['CAPACITY_EXIT_CODE'])
          rows = [line.split() for line in (root / 'capacity.txt').read_text().splitlines() if re.fullmatch(r'[0-9]+ [0-9]+', line)]
          memory, cpus = (map(int, rows[0]) if status == 0 and len(rows) == 1 else (None, None))
          qualified = memory is not None and memory >= 10737418240 and cpus >= 4
          (root / 'capacity.json').write_text(json.dumps({'schema': 'mount-rs.hosted-engine-capacity.v1', 'memory_bytes': memory, 'cpu_count': cpus, 'min_memory_bytes': 10737418240, 'min_cpu_count': 4, 'qualified': qualified, 'exit_code': status}, sort_keys=True) + '\n')
          if not qualified: raise SystemExit('selected Engine does not meet the unchanged 10 GiB and four CPU floors')
          PY
          export MOUNT_RS_BACKING_PILOT=1 MOUNT_RS_RUSTFS_COMBO_ONLY=1 MOUNT_RS_PROFILE_IO=1
          export MOUNT_RS_BACKING_ENGINE_CAPABILITY="$PILOT_PRIVATE/engine.json" MOUNT_RS_BACKING_PILOT_OUTPUT="$PILOT_PRIVATE/pilot.json"
          export RUSTFS_COMBO_COMMAND='./scripts/test-tidb.sh' RUSTFS_COMBO_TIMEOUT_SECONDS=900
          export MOUNT_RS_TIDB_NAPI=1 MOUNT_RS_TIDB_IOPS=1 MOUNT_RS_TIDB_TOPOLOGY=durable MOUNT_RS_TIDB_ALLOW_UNDERPROVISIONED=0
          export MOUNT_RS_TIDB_IOPS_SIZE_MIB=1 MOUNT_RS_TIDB_IOPS_PAYLOAD_BYTES=4096 MOUNT_RS_TIDB_IOPS_ITERATIONS=400 MOUNT_RS_TIDB_IOPS_CONCURRENCY=64 MOUNT_RS_TIDB_IOPS_MIN=1000
          status=0
          ./scripts/test-rustfs.sh > "$PILOT_PRIVATE/fixture.log" 2>&1 || status=$?
          printf 'Owned backing pilot wrapper exit status: %s\n' "$status"
          source_status=0
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || source_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$source_status"
      - name: Verify observed pilot artifact and native build join
        if: always()
        run: |
          if [ -f "$PILOT_PRIVATE/pilot.json" ]; then
            node scripts/verify-owned-backing-pilot.mjs "$PILOT_PRIVATE/pilot.json" "$PILOT_PRIVATE/build.json"
          else
            echo 'Owned backing pilot artifact unavailable' >&2
            exit 1
          fi
      - name: Retain sanitized pilot and fixed source, addon, and capacity receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-owned-backing-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PILOT_PRIVATE }}/pilot.json
            ${{ env.PILOT_PRIVATE }}/build.json
            ${{ env.PILOT_PRIVATE }}/capacity.json
          if-no-files-found: error
          retention-days: 14

  formal-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.formal_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.95.0
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Bind clean source and derive every named proof invocation
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mount-rs-formal-target"
          export KANI_HOME="$RUNNER_TEMP/mount-rs-formal-kani"
          export FORMAL_EVIDENCE="$RUNNER_TEMP/mount-rs-formal-evidence"
          printf 'CARGO_TARGET_DIR=%s\nKANI_HOME=%s\nFORMAL_EVIDENCE=%s\n' "$CARGO_TARGET_DIR" "$KANI_HOME" "$FORMAL_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -m 700 "$FORMAL_EVIDENCE"
          git rev-parse HEAD > "$FORMAL_EVIDENCE/checkout-sha.txt"
          git status --porcelain=v1 --untracked-files=all > "$FORMAL_EVIDENCE/source-before.txt"
          test ! -s "$FORMAL_EVIDENCE/source-before.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shlex, subprocess, tomllib
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['FORMAL_EVIDENCE'])
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '*.rs', '*Cargo.toml', '*Cargo.lock', 'scripts/verify-*formal', 'scripts/cargo-shared*'], text=True).split('\0')
          source_hashes = {path: digest(root / path) for path in tracked if path}
          (evidence / 'source-sha256.json').write_text(json.dumps(source_hashes, sort_keys=True) + '\n')
          (evidence / 'root-lock-before.toml').write_bytes((root / 'Cargo.lock').read_bytes())
          def package_for(path):
              for directory in path.parents:
                  manifest = directory / 'Cargo.toml'
                  if manifest.is_file():
                      value = tomllib.loads(manifest.read_text()).get('package', {}).get('name')
                      if value: return value
                  if directory == root: break
              raise ValueError('proof source has no package identity')
          declarations = {}
          pattern = re.compile(r'#\[kani::proof\](?:\s*#\[[^]]+\])*\s*(?:pub(?:\([^)]*\))?\s+)?(?:unsafe\s+)?fn\s+(\w+)\s*\(')
          for relative in source_hashes:
              if not relative.endswith('.rs'): continue
              path = root / relative
              content = path.read_text()
              for match in pattern.finditer(content):
                  start = content.find('{', match.end())
                  if start < 0: raise ValueError('proof body unavailable')
                  depth, end = 1, start + 1
                  while depth and end < len(content):
                      depth += (content[end] == '{') - (content[end] == '}')
                      end += 1
                  if depth: raise ValueError('proof body boundary unavailable')
                  identity = package_for(path) + '/' + match.group(1)
                  if identity in declarations: raise ValueError('duplicate proof declaration')
                  declarations[identity] = {'source': relative, 'source_sha256': source_hashes[relative], 'line': content.count('\n', 0, match.start()) + 1, 'declared_covers': len(re.findall(r'kani::cover!\s*\(', content[start:end])), 'declared_unwind': re.findall(r'#\[kani::unwind\(([^)]+)\)\]', match.group())}
          # Both grammar proofs call check_block_id_grammar, whose four covers
          # are outside the proof bodies. Direct lexical counts are provenance,
          # not an exact bound on Kani's transitive/expanded cover properties.
          helper_covers = {'mount-rs-object-store-blocks/legacy_block_id_grammar_is_lowercase_hex': 4, 'mount-rs-object-store-blocks/content_block_id_grammar_is_lowercase_hex': 4}
          for identity, value in declarations.items():
              value['required_covers_minimum'] = max(value['declared_covers'], helper_covers.get(identity, 0))
          baseline = set(["mount-rs-core/single_extent_validation","mount-rs-core/two_extent_validation","mount-rs-core/three_extent_validation","mount-rs-core/inode_publication_preserves_structural_attributes","mount-rs-core/directory_link_count_boundaries","mount-rs-core/namespace_path_boundaries","mount-rs-core/decoded_truncation_requires_write","mount-rs-core/linux_wire_open_bits_preserve_access_and_truncate_guard","mount-rs-core/read_lease_ttl_milliseconds_are_checked","mount-rs-napi/native_numeric_open_bits_preserve_host_rights_and_truncate_guard","mount-rs-9p/bounded_payload_range_stays_within_wire_input","mount-rs-9p/bounded_frame_size_classification_matches_wire_bounds","mount-rs-fuse/reply_frame_len_bounds","mount-rs-nfs/stateid_tokens_are_injective","mount-rs-nfs/anonymous_access_uses_other_mode_bits","mount-rs-nfs/anonymous_access4_uses_other_mode_bits","mount-rs-nfs/nonroot_access_selects_owner_primary_supplemental_and_other","mount-rs-nfs/nonroot_access4_selects_owner_primary_supplemental_and_other","mount-rs-nfs/supported_access4_mask_respects_request_and_object_kind","mount-rs-nfs/var_opaque_frame_bounds","mount-rs-nfs/var_opaque_short_wire_payload","mount-rs-nfs/var_opaque_short_wire_decision","mount-rs-nfs/var_opaque_all_wire_prefixes","mount-rs-nfs/record_fragment_total_never_wraps_or_exceeds_limit","mount-rs-nfs/record_pending_budget_matches_exact_wire_envelope","mount-rs-s3/part_number_marker_boundary_does_not_wrap","mount-rs-s3/decoded_chunk_total_never_wraps_or_exceeds_limits","mount-rs-s3/chunk_payload_and_footer_stay_within_body","mount-rs-chunked/reacquired_writer_fence_is_exactly_next","mount-rs-webdav/timeout_and_remaining_are_wide_before_clamping","mount-rs-webdav/canonical_scope_and_two_lock_conflicts","mount-rs-sqlite-vfs/sqlite_io_extent_matches_signed_range","mount-rs-sqlite/view_pin_renewal_requires_exact_live_token_and_checked_expiry","mount-rs-sqlite/signed_writer_lease_boundaries_are_checked","mount-rs-pglite/view_pin_renewal_requires_exact_live_token_and_checked_expiry","mount-rs-pglite/signed_writer_lease_boundaries_are_checked","mount-rs-object-store-blocks/reconciliation_deletes_only_unreferenced_direct_old_blocks","mount-rs-object-store-blocks/legacy_block_id_grammar_is_lowercase_hex","mount-rs-object-store-blocks/content_block_id_grammar_is_lowercase_hex","mount-rs-fskit-bridge/abi_request_slice_preconditions","mount-rs-fskit-bridge/frame_header_classification_precedes_body_copy","mount-rs-foundationdb/writer_takeover_is_fenced_and_checked","mount-rs-foundationdb/writer_renewal_requires_exact_live_fence_and_checked_expiry","mount-rs-foundationdb/authority_time_sample_is_monotonic_and_bounds_forward_jumps","mount-rs-service/remote_grant_requires_exact_scope_and_all_claims","mount-rs-service/remote_handle_admission_is_fenced_and_bounded","mount-rs-remote-protocol/binary_io_lengths_bounded_before_allocation","mount-rs-service/generic_control_charge_cannot_wrap_or_exceed_default_admission","mount-rs-remote-protocol/remote_readonly_flags_require_explicit_nonmutating_values","mount-rs-service/remote_read_grants_cannot_authorize_mutations","mount-rs-service/remote_handles_require_exact_drive_and_revision","mount-rs-core/cache_reservations_never_wrap_or_exceed_budget"])
          invocations = []
          for runner in ['verify-formal', 'verify-remote-formal', 'verify-cache-formal']:
              cwd = '.'
              for line in (root / 'scripts' / runner).read_text().splitlines():
                  if line.strip() == 'cd transports/mount-rs-fskit': cwd = 'transports/mount-rs-fskit'
                  if line.strip() == ')': cwd = '.'
                  if 'scripts/cargo-shared kani ' not in line: continue
                  args = shlex.split(line)
                  if args[0] not in ['./scripts/cargo-shared', '../../scripts/cargo-shared'] or args[1] != 'kani' or args.count('--harness') != 1:
                      raise ValueError('unsupported named runner invocation')
                  package = args[args.index('-p') + 1] if '-p' in args else package_for(root / cwd / 'src/lib.rs')
                  identity = package + '/' + args[args.index('--harness') + 1]
                  if identity not in declarations: raise ValueError('named invocation has no proof declaration')
                  invocations.append({'runner': runner, 'cwd': cwd, 'args': args, 'identity': identity, **declarations[identity]})
          selected = {value['identity'] for value in invocations}
          if len(selected) != len(invocations) or not baseline.issubset(selected) or selected != set(declarations):
              raise ValueError('named runner coverage differs from committed proof inventory')
          (evidence / 'inventory.json').write_text(json.dumps({'schema': 'mount-rs.formal-inventory.v1', 'checkout_sha': (evidence / 'checkout-sha.txt').read_text().strip(), 'baseline_proofs': len(baseline), 'expected_proofs': len(invocations), 'invocations': invocations}, indent=2, sort_keys=True) + '\n')
          PY
      - name: Install bindgen prerequisites and extract the pinned FDB client without starting a server
        run: |
          set -euo pipefail
          sudo apt-get update > "$FORMAL_EVIDENCE/prerequisites.log" 2>&1
          sudo apt-get install -y --no-install-recommends clang libclang-dev >> "$FORMAL_EVIDENCE/prerequisites.log" 2>&1
          client_image='foundationdb/foundationdb:7.4.7@sha256:c13aed110fe17c6feb678f5dadc73dbcc2dbc42f2a3e952a877c116f63f052d3'
          client_dir="$RUNNER_TEMP/mount-rs-formal-fdb-client"
          owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$client_dir"
          cid=''
          cleanup() {
            status=$?
            if [ -n "$cid" ]; then
              identity=$(docker container inspect "$cid" --format '{{.Id}} {{.State.Running}} {{index .Config.Labels "mount-rs.formal.run"}}' 2>> "$FORMAL_EVIDENCE/prerequisites.log") || identity=''
              if [ "$identity" = "$cid false $owner" ] && docker rm "$cid" >> "$FORMAL_EVIDENCE/prerequisites.log" 2>&1; then
                printf 'removed\n' > "$FORMAL_EVIDENCE/fdb-client-cleanup.txt"
              else
                printf 'failed\n' > "$FORMAL_EVIDENCE/fdb-client-cleanup.txt"
                status=1
              fi
            else
              printf 'unavailable\n' > "$FORMAL_EVIDENCE/fdb-client-cleanup.txt"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$client_image" >> "$FORMAL_EVIDENCE/prerequisites.log" 2>&1
          docker image inspect "$client_image" --format '{{.Id}}' > "$FORMAL_EVIDENCE/fdb-image-id.txt"
          cid=$(docker create --platform linux/amd64 --label "mount-rs.formal.run=$owner" "$client_image" 2>> "$FORMAL_EVIDENCE/prerequisites.log")
          test -n "$cid"
          docker cp "$cid:/usr/lib/libfdb_c.so" "$client_dir/libfdb_c.so" >> "$FORMAL_EVIDENCE/prerequisites.log" 2>&1
          printf 'FDB_CLIENT_LIB_PATH=%s\nLD_LIBRARY_PATH=%s\n' "$client_dir" "$client_dir" >> "$GITHUB_ENV"
          sha256sum "$client_dir/libfdb_c.so" > "$FORMAL_EVIDENCE/fdb-client-sha256.txt"
          clang --version > "$FORMAL_EVIDENCE/clang-version.txt"
          dpkg-query -W clang libclang-dev > "$FORMAL_EVIDENCE/bindgen-package-versions.txt"
      - name: Install exactly Kani 0.68 and retain setup and tool identity
        id: formal_tools
        run: |
          set -euo pipefail
          rustc --version --verbose > "$FORMAL_EVIDENCE/host-rustc-version.txt"
          cargo --version --verbose > "$FORMAL_EVIDENCE/host-cargo-version.txt"
          grep -q '^rustc 1\.95\.0 ' "$FORMAL_EVIDENCE/host-rustc-version.txt"
          ./scripts/cargo-shared install --version 0.68.0 --locked kani-verifier > "$FORMAL_EVIDENCE/kani-install.log" 2>&1
          ./scripts/cargo-shared kani setup > "$FORMAL_EVIDENCE/kani-setup.log" 2>&1
          ./scripts/cargo-shared kani --version > "$FORMAL_EVIDENCE/kani-version.txt" 2>&1
          grep -q '^Kani Rust Verifier 0\.68\.0 ' "$FORMAL_EVIDENCE/kani-version.txt"
          grep -q '^CBMC 6\.11\.0$' "$FORMAL_EVIDENCE/kani-version.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          evidence = pathlib.Path(os.environ['FORMAL_EVIDENCE'])
          bundle = pathlib.Path(os.environ['KANI_HOME']) / 'kani-0.68.0'
          tools = {'installed-kani': pathlib.Path(shutil.which('kani')), 'installed-cargo-kani': pathlib.Path(shutil.which('cargo-kani'))}
          tools.update({name: bundle / 'bin' / name for name in ['kani-driver', 'kani-compiler', 'cbmc', 'goto-instrument']})
          tools.update({name: bundle / 'toolchain' / 'bin' / name for name in ['rustc', 'cargo']})
          receipt = {'schema': 'mount-rs.formal-tools.v1', 'kani_version': '0.68.0', 'cbmc_version': '6.11.0', 'host_rust': '1.95.0', 'kani_toolchain': (bundle / 'rust-toolchain-version').read_text().strip(), 'kani_rustc_build': (bundle / 'rustc-version').read_text().strip(), 'binaries': {name: hashlib.sha256(path.resolve(strict=True).read_bytes()).hexdigest() for name, path in tools.items()}}
          (evidence / 'tool-identity.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          (evidence / 'kani-rustc-version.txt').write_text(subprocess.check_output([str(bundle / 'toolchain/bin/rustc'), '--version', '--verbose'], text=True))
          (evidence / 'kani-cargo-version.txt').write_text(subprocess.check_output([str(bundle / 'toolchain/bin/cargo'), '--version', '--verbose'], text=True))
          PY
          # Kani 0.68 does not forward --locked to proof builds. Capture the
          # independent FSKit resolution, then gate both lock digests at exit.
          ./scripts/cargo-shared generate-lockfile --manifest-path transports/mount-rs-fskit/Cargo.toml > "$FORMAL_EVIDENCE/fskit-lock-generation.log" 2>&1
          cp transports/mount-rs-fskit/Cargo.lock "$FORMAL_EVIDENCE/fskit-lock-before.toml"
      - name: Run the unchanged full general proof runner
        if: ${{ !cancelled() && steps.formal_tools.outcome == 'success' }}
        run: |
          status=0
          PS4='+ ' bash -x ./scripts/verify-formal > "$FORMAL_EVIDENCE/verify-formal.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$FORMAL_EVIDENCE/verify-formal.exit"
          cat "$FORMAL_EVIDENCE/verify-formal.log"
          exit "$status"
      - name: Run the unchanged remote proof runner
        if: ${{ !cancelled() && steps.formal_tools.outcome == 'success' }}
        run: |
          status=0
          PS4='+ ' bash -x ./scripts/verify-remote-formal > "$FORMAL_EVIDENCE/verify-remote-formal.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$FORMAL_EVIDENCE/verify-remote-formal.exit"
          cat "$FORMAL_EVIDENCE/verify-remote-formal.log"
          exit "$status"
      - name: Run the unchanged cache proof runner
        if: ${{ !cancelled() && steps.formal_tools.outcome == 'success' }}
        run: |
          status=0
          PS4='+ ' bash -x ./scripts/verify-cache-formal > "$FORMAL_EVIDENCE/verify-cache-formal.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$FORMAL_EVIDENCE/verify-cache-formal.exit"
          cat "$FORMAL_EVIDENCE/verify-cache-formal.log"
          exit "$status"
      - name: Retain per-harness checks, covers, incomplete proofs, locks and source identity
        if: always() && env.FORMAL_EVIDENCE != ''
        run: |
          set -euo pipefail
          mkdir -p "$FORMAL_EVIDENCE/harnesses"
          git status --porcelain=v1 --untracked-files=all > "$FORMAL_EVIDENCE/source-after.txt"
          cp Cargo.lock "$FORMAL_EVIDENCE/root-lock-after.toml"
          if [ -f transports/mount-rs-fskit/Cargo.lock ]; then cp transports/mount-rs-fskit/Cargo.lock "$FORMAL_EVIDENCE/fskit-lock-after.toml"; fi
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shlex
          evidence = pathlib.Path(os.environ['FORMAL_EVIDENCE'])
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          inventory_path = evidence / 'inventory.json'
          if not inventory_path.is_file(): raise SystemExit('proof inventory unavailable; no qualification')
          inventory = json.loads(inventory_path.read_text())
          results, unexpected = [], []
          for runner in ['verify-formal', 'verify-remote-formal', 'verify-cache-formal']:
              expected = [value for value in inventory['invocations'] if value['runner'] == runner]
              path = evidence / (runner + '.log')
              content = path.read_text() if path.is_file() else ''
              chunks = {}
              current = None
              for line in content.splitlines(keepends=True):
                  if re.match(r'^\+ (?:\./|\.\./\.\./)scripts/cargo-shared kani ', line):
                      args = shlex.split(line[2:])
                      matches = [value for value in expected if value['args'] == args]
                      if len(matches) != 1 or matches[0]['identity'] in chunks:
                          unexpected.append({'runner': runner, 'command': line.strip()})
                          current = None
                      else:
                          current = matches[0]['identity']
                          chunks[current] = []
                  if current is not None: chunks[current].append(line)
              exit_path = evidence / (runner + '.exit')
              runner_exit = int(exit_path.read_text().strip()) if exit_path.is_file() else None
              for value in expected:
                  text = ''.join(chunks.get(value['identity'], []))
                  destination = evidence / 'harnesses' / (value['identity'].replace('/', '--') + '.log')
                  destination.write_text(text if text else 'UNEXECUTED: named runner did not reach this invocation.\n')
                  # Preserve raw logs/hashes, removing only display SGR codes
                  # for the pinned Kani renderer's human-readable summaries.
                  parsed = re.sub(r'\x1b\[[0-9;]*m', '', text)
                  checks = re.findall(r'^\s*\*\* (\d+) of (\d+) failed(?:\s+\([^\n]*\))?\s*$', parsed, re.M)
                  covers = re.findall(r'^\s*\*\* (\d+) of (\d+) cover properties satisfied(?:\s+\([^\n]*\))?\s*$', parsed, re.M)
                  checking = re.findall(r'^Checking harness (.+)\.\.\.$', parsed, re.M)
                  completion = re.findall(r'^Complete - (\d+) successfully verified harnesses, (\d+) failures, (\d+) total\.$', parsed, re.M)
                  verification = re.findall(r'^VERIFICATION:- (.+)$', parsed, re.M)
                  name = value['identity'].split('/', 1)[1]
                  complete = len(checking) == 1 and checking[0].split('::')[-1] == name and completion == [('1', '0', '1')] and len(checks) == 1 and int(checks[0][0]) == 0 and int(checks[0][1]) > 0 and verification == ['SUCCESSFUL']
                  minimum = value['required_covers_minimum']
                  cover_ok = len(covers) == 1 and int(covers[0][0]) == int(covers[0][1]) and int(covers[0][1]) >= minimum if covers else minimum == 0
                  status = 'verified' if complete and cover_ok else 'incomplete_or_failed' if text else 'unexecuted'
                  results.append({**value, 'status': status, 'runner_exit_code': runner_exit, 'failed_checks': int(checks[0][0]) if len(checks) == 1 else None, 'checks': int(checks[0][1]) if len(checks) == 1 else None, 'covers_satisfied': int(covers[0][0]) if len(covers) == 1 else 0 if complete else None, 'covers': int(covers[0][1]) if len(covers) == 1 else 0 if complete else None, 'log_sha256': digest(destination)})
          source_hashes = json.loads((evidence / 'source-sha256.json').read_text())
          source_unchanged = all(pathlib.Path(path).is_file() and digest(pathlib.Path(path)) == expected for path, expected in source_hashes.items())
          locks = {}
          for workspace in ['root', 'fskit']:
              before, after = evidence / (workspace + '-lock-before.toml'), evidence / (workspace + '-lock-after.toml')
              locks[workspace] = {'before_sha256': digest(before) if before.is_file() else None, 'after_sha256': digest(after) if after.is_file() else None}
          target = pathlib.Path(os.environ['CARGO_TARGET_DIR'])
          models = {str(path.relative_to(target)): digest(path) for path in (target / 'kani').rglob('*') if path.is_file() and not path.is_symlink() and (path.name.endswith('.out') or path.name.endswith('.kani-metadata.json'))}
          (evidence / 'model-sha256.json').write_text(json.dumps(models, sort_keys=True) + '\n')
          cleanup_path = evidence / 'fdb-client-cleanup.txt'
          cleanup_complete = cleanup_path.is_file() and cleanup_path.read_text().strip() == 'removed'
          tool_path = evidence / 'tool-identity.json'
          tools = json.loads(tool_path.read_text()) if tool_path.is_file() else {}
          binary_names = {'installed-kani', 'installed-cargo-kani', 'kani-driver', 'kani-compiler', 'cbmc', 'goto-instrument', 'rustc', 'cargo'}
          tool_identity_complete = tools.get('schema') == 'mount-rs.formal-tools.v1' and tools.get('kani_version') == '0.68.0' and tools.get('cbmc_version') == '6.11.0' and tools.get('host_rust') == '1.95.0' and all(isinstance(tools.get(key), str) and tools[key] for key in ['kani_toolchain', 'kani_rustc_build']) and isinstance(tools.get('binaries'), dict) and set(tools['binaries']) == binary_names and all(isinstance(value, str) and re.fullmatch(r'[0-9a-f]{64}', value) for value in tools['binaries'].values())
          verified = len(results) == inventory['expected_proofs'] and all(value['status'] == 'verified' and value['runner_exit_code'] == 0 for value in results) and not unexpected and source_unchanged and not (evidence / 'source-after.txt').read_text().strip() and tool_identity_complete and cleanup_complete and bool(models) and all(value['before_sha256'] is not None and value['before_sha256'] == value['after_sha256'] for value in locks.values())
          summary = {'schema': 'mount-rs.formal-qualification.v1', 'checkout_sha': inventory['checkout_sha'], 'expected_proofs': inventory['expected_proofs'], 'verified_proofs': sum(value['status'] == 'verified' for value in results), 'qualified': verified, 'source_unchanged': source_unchanged, 'client_cleanup_complete': cleanup_complete, 'tool_identity_complete': tool_identity_complete, 'lock_verification': 'before_and_after_digest; Kani 0.68 does not forward --locked', 'locks': locks, 'unexpected_invocations': unexpected, 'results': results, 'scope': 'bounded symbolic current-source decisions; no provider, kernel, network, durability, cache-fault or production capacity qualification'}
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          if not verified: raise SystemExit('full current-source proof inventory did not qualify; retained statuses name missing or failed proofs')
          PY
      - name: Retain full proof qualification evidence
        if: always() && env.FORMAL_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-formal-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FORMAL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
