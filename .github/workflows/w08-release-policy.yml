name: W08 release policy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w08-release-policy-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  w08-release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Verify W08 rollout ledger policy
        run: |
          node scripts/verify-w08-rollout-ledger.mjs
          node scripts/test-w08-rollout-ledger.mjs
          node scripts/verify-w08-production-evidence.mjs
          node scripts/test-w08-production-evidence.mjs
          node scripts/verify-w08-production-topology.mjs \
            tests/tidb/production-topology-policy.json
          node scripts/test-w08-production-topology.mjs
          node scripts/verify-w08-production-secrets.mjs \
            tests/tidb/production-secrets-policy.json
          node scripts/test-w08-production-secrets.mjs
          node scripts/verify-w08-production-backup.mjs \
            tests/tidb/production-backup-policy.json
          node scripts/test-w08-production-backup.mjs
          node scripts/verify-w08-production-upgrade.mjs \
            tests/tidb/production-upgrade-policy.json
          node scripts/test-w08-production-upgrade.mjs
          node scripts/verify-w08-production-observability.mjs \
            tests/tidb/production-observability-policy.json
          node scripts/test-w08-production-observability.mjs
      - name: Verify W08 release identity and provenance policy
        run: |
          set -euo pipefail

          release_target="$RUNNER_TEMP/w08-release-target"
          release_dir="$RUNNER_TEMP/w08-release-artifact"
          mkdir -p "$release_dir"
          CARGO_TARGET_DIR="$release_target" \
            ./scripts/cargo-shared build --locked --release -p mount-rs-cli
          target="$(rustc -vV | sed -n 's/^host: //p')"
          artifact="mount-rs-0.1.0-${target}.tar.gz"
          cp "$release_target/release/mount-rs" "$release_dir/mount-rs"
          chmod 755 "$release_dir/mount-rs"
          COPYFILE_DISABLE=1 tar -czf "$release_dir/$artifact" \
            -C "$release_dir" mount-rs
          node scripts/write-w08-release-manifest.mjs \
            --artifact "$release_dir/$artifact" \
            --output "$release_dir/release-manifest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --version 0.1.0 \
            --tag v0.1.0-ci-policy \
            --target "$target" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID"
          node scripts/verify-w08-release-manifest.mjs \
            "$release_dir/release-manifest.json" \
            "$release_dir/$artifact"
          cargo metadata --locked --format-version 1 > "$release_dir/cargo-metadata.json"
          node scripts/write-w08-release-sbom.mjs \
            --metadata "$release_dir/cargo-metadata.json" \
            --output "$release_dir/release-sbom.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --package mount-rs-cli \
            --version 0.1.0 \
            --artifact "$release_dir/$artifact"
          node scripts/verify-w08-release-sbom.mjs \
            --sbom "$release_dir/release-sbom.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --package mount-rs-cli \
            --version 0.1.0 \
            --artifact "$release_dir/$artifact"
          (cd "$release_dir" && sha256sum "$artifact" release-manifest.json release-sbom.json > SHA256SUMS)
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          test "$(tar -tzf "$release_dir/$artifact")" = "mount-rs"
          test "$("$release_dir/mount-rs" --version)" = "mount-rs 0.1.0"
          extracted_dir="$RUNNER_TEMP/w08-release-extracted"
          mkdir -p "$extracted_dir"
          tar -xzf "$release_dir/$artifact" -C "$extracted_dir"
          test "$("$extracted_dir/mount-rs" --version)" = "mount-rs 0.1.0"
          node scripts/verify-w08-release-manifest.mjs \
            tests/tidb/release-manifest-policy.json
          node scripts/verify-w08-release-manifest.mjs \
            tests/tidb/release-manifest-policy.accepted.json \
            --require-release-acceptance
          if node scripts/verify-w08-release-manifest.mjs \
            tests/tidb/release-manifest-policy.invalid.json; then
            echo 'W08 release manifest policy accepted an invalid fixture' >&2
            exit 1
          fi
