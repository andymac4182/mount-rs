name: Fault injection

on:
  push:
  pull_request:

jobs:
  storage-faults:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p mount-rs-fault-injection -- --check
      - run: cargo test --locked -p mount-rs-fault-injection
      - run: cargo test --locked -p mount-rs-fault-injection --all-features
      - run: cargo clippy --locked -p mount-rs-fault-injection --all-targets --all-features -- -D warnings
