name: Fault injection

on:
  push:
  pull_request:

jobs:
  storage-faults:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/mount-rs-fault-injection -> target
      - run: cargo fmt --manifest-path integrations/mount-rs-fault-injection/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path integrations/mount-rs-fault-injection/Cargo.toml
      - run: cargo test --locked --manifest-path integrations/mount-rs-fault-injection/Cargo.toml --all-features
      - run: cargo clippy --locked --manifest-path integrations/mount-rs-fault-injection/Cargo.toml --all-targets --all-features -- -D warnings
