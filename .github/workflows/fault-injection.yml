name: Fault injection

on:
  push:
  pull_request:

concurrency:
  group: fault-injection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-faults:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt -p mount-rs-fault-injection -- --check
      - run: cargo test --locked -p mount-rs-fault-injection
      - run: cargo test --locked -p mount-rs-fault-injection --all-features
      - run: cargo clippy --locked -p mount-rs-fault-injection --all-targets --all-features -- -D warnings
