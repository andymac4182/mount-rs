name: Filesystem Writeback

on:
  push:
    branches-ignore:
      - 'codex/full-target-evidence-probe-20260930-1106'
    paths:
      - providers/mount-rs-filesystem-blocks/**
      - crates/mount-rs-sdk/**
      - crates/mount-rs-service/**
      - apps/mount-rs-cli/**
      - src/storage.rs
      - src/diagnostics/filesystem_blocks.rs
      - .github/workflows/filesystem-writeback.yml
  pull_request:
    paths:
      - providers/mount-rs-filesystem-blocks/**
      - crates/mount-rs-sdk/**
      - crates/mount-rs-service/**
      - apps/mount-rs-cli/**
      - src/storage.rs
      - src/diagnostics/filesystem_blocks.rs
      - .github/workflows/filesystem-writeback.yml

permissions:
  contents: read

jobs:
  writeback:
    name: filesystem writeback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          components: rustfmt, clippy
      - name: Select a private target directory
        run: printf 'CARGO_TARGET_DIR=%s/mount-rs-filesystem-writeback-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check workspace formatting
        timeout-minutes: 1
        run: ./scripts/cargo-shared fmt --all -- --check
      - name: Verify complete filesystem provider contracts and profiling
        timeout-minutes: 5
        run: ./scripts/cargo-shared test --locked -p mount-rs-filesystem-blocks --features io-profiling --all-targets
      - name: Verify SDK filesystem capabilities and CLI configuration
        timeout-minutes: 10
        run: |
          ./scripts/cargo-shared test --locked -p mount-rs-sdk --lib filesystem_provider_tests
          ./scripts/cargo-shared test --locked -p mount-rs-cli filesystem
      - name: Verify actual runtime eviction and reopen with filesystem writeback
        timeout-minutes: 5
        run: ./scripts/cargo-shared test --locked -p mount-rs-service --features sdk-runtime --test runtime_pool_filesystem
      - name: Check strict Clippy for provider, SDK, service and CLI
        timeout-minutes: 5
        run: ./scripts/cargo-shared clippy --locked -p mount-rs-filesystem-blocks -p mount-rs-sdk -p mount-rs-service -p mount-rs-cli --all-targets --features mount-rs-filesystem-blocks/io-profiling -- -D warnings
