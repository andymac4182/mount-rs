name: Filesystem Writeback Regression

on:
  push:
    paths:
      - providers/mount-rs-filesystem-blocks/**
      - scripts/check-filesystem-writeback-red.py
      - .github/workflows/filesystem-writeback.yml
  pull_request:
    paths:
      - providers/mount-rs-filesystem-blocks/**
      - scripts/check-filesystem-writeback-red.py
      - .github/workflows/filesystem-writeback.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: expected writeback policy failure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-filesystem-writeback-target
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      MOUNT_RS_FILESYSTEM_WRITEBACK_EVIDENCE: ${{ runner.temp }}/mount-rs-filesystem-writeback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Verify two executed assertions reject the old forced-sync policy
        run: python3 -I -S -B scripts/check-filesystem-writeback-red.py
      - name: Retain bounded RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: filesystem-writeback-red-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MOUNT_RS_FILESYSTEM_WRITEBACK_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
