name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Ordinary pushes stay cheap, while an explicitly dispatched release
  # qualification must retain a private group and finish across mainline
  # churn so its terminal evidence is usable for production review.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ozone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: tests/ozone -> target
      - name: Validate the Ozone provider config without credentials or mounts
        run: |
          cargo test --locked -p mount-rs-cli --test cli \
            actual_binary_validates_the_loopback_ozone_provider_config_without_credentials_or_network
          cargo test --locked -p mount-rs-cli r2_endpoint_validation_rejects_unsafe_url_shapes
          node examples/node-cli/index.mjs \
            --config apps/mount-rs-cli/examples/config-pglite-ozone.json --check
      - name: Verify W26 Ozone production config policy without credentials or network
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
          export MOUNT_RS_TIDB_TLS_URL='mysql://tls-policy-user@tidb-policy.invalid:4000/app?require_ssl=true&verify_ca=true&verify_identity=true&built_in_roots=true'
          for config in \
            tests/ozone/production-config-policy-sqlite.json \
            tests/ozone/production-config-policy-pglite.json \
            tests/ozone/production-config-policy-tidb.json \
            tests/ozone/production-config-policy-foundationdb.json
          do
            node scripts/verify-w26-ozone-production-config.mjs "$config"
          done
          if node scripts/verify-w26-ozone-production-config.mjs \
            tests/ozone/production-config-policy.invalid.json
          then
            echo 'W26 Ozone production config policy accepted an insecure fixture' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_CONFIG_POLICY_NEGATIVE_PASS case=insecure-blocks'
          if node scripts/verify-w26-ozone-production-config.mjs \
            tests/ozone/production-config-policy-inline-secret.invalid.json
          then
            echo 'W26 Ozone production config policy accepted an inline secret fixture' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_CONFIG_POLICY_NEGATIVE_PASS case=inline-secret'
          if node scripts/verify-w26-ozone-production-config.mjs \
            tests/ozone/production-config-policy-foundationdb.invalid.json
          then
            echo 'W26 Ozone production config policy accepted an unsafe FoundationDB fixture' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_CONFIG_POLICY_NEGATIVE_PASS case=foundationdb-unsafe'
          if MOUNT_RS_TIDB_TLS_URL='mysql://tls-policy-user@tidb-policy.invalid:4000/app?require_ssl=true&verify_ca=true&verify_identity=false&built_in_roots=true' \
            node scripts/verify-w26-ozone-production-config.mjs \
            tests/ozone/production-config-policy-tidb-tls.invalid.json
          then
            echo 'W26 Ozone production config policy accepted a weak TiDB TLS fixture' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_CONFIG_POLICY_NEGATIVE_PASS case=tidb-tls-weak'
          node scripts/verify-w26-ozone-rollout-contract.mjs \
            tests/ozone/production-rollout-contract.json
          if node scripts/verify-w26-ozone-rollout-contract.mjs \
            tests/ozone/production-rollout-contract-slo.invalid.json
          then
            echo 'W26 Ozone rollout contract accepted an RTO above five minutes' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_ROLLOUT_CONTRACT_NEGATIVE_PASS case=slo'
          if node scripts/verify-w26-ozone-rollout-contract.mjs \
            tests/ozone/production-rollout-contract-inline-secret.invalid.json
          then
            echo 'W26 Ozone rollout contract accepted an inline secret' >&2
            exit 1
          fi
          echo 'W26_OZONE_PRODUCTION_ROLLOUT_CONTRACT_NEGATIVE_PASS case=inline-secret'
          } 2>&1 | tee artifacts/ozone-policy.log
      - name: Verify W04 PGlite production config policy without credentials or network
        run: |
          node scripts/verify-w04-pglite-production-config.mjs \
            tests/pglite/production-config-policy.json
          if node scripts/verify-w04-pglite-production-config.mjs \
            tests/pglite/production-config-policy.invalid.json; then
            echo 'W04 PGlite production config policy accepted a non-durable fixture' >&2
            exit 1
          fi
          if node scripts/verify-w04-pglite-production-config.mjs \
            tests/pglite/production-config-policy-inline-secret.invalid.json; then
            echo 'W04 PGlite production config policy accepted an inline-secret fixture' >&2
            exit 1
          fi
          if node scripts/verify-w04-pglite-production-config.mjs \
            tests/pglite/production-config-policy-invalid-ttl.json; then
            echo 'W04 PGlite production config policy accepted an invalid lease TTL fixture' >&2
            exit 1
          fi
          if node scripts/verify-w04-pglite-production-config.mjs \
            tests/pglite/production-config-policy-missing-ttl.invalid.json; then
            echo 'W04 PGlite production config policy accepted a missing lease TTL fixture' >&2
            exit 1
          fi
      - name: Verify real Apache Ozone block contract and restart recovery
        run: |
          set -o pipefail
          mkdir -p artifacts
          sh scripts/test-ozone.sh 2>&1 | tee artifacts/ozone-base.log
      - name: Preserve W26 Ozone base evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w26-ozone-base-evidence
          path: |
            artifacts/ozone-base.log
            artifacts/ozone-policy.log
          if-no-files-found: error

  ozone-compositions:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: tests/ozone -> target
      - name: Install the real PGlite composition service
        run: pnpm --dir tests/pglite install --frozen-lockfile
      - name: Install the public Node SDK test addon
        run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build the public Node SDK test addon outside the checkout
        env:
          CARGOFLAGS: --locked
        run: |
          set -eu
          napi_stage="$RUNNER_TEMP/mount-rs-napi-stage"
          mkdir -p "$napi_stage"
          pnpm --dir bindings/mount-rs-napi exec napi build \
            --platform --release --no-js --output-dir "$napi_stage"
          native_path=$(find "$napi_stage" -maxdepth 1 -type f -name '*.node' -print)
          test -n "$native_path"
          test "$(printf '%s\n' "$native_path" | wc -l | tr -d ' ')" = 1
          printf 'NAPI_RS_NATIVE_LIBRARY_PATH=%s\n' "$native_path" >> "$GITHUB_ENV"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo 'W26_NAPI_BUILD_SOURCE_CLEAN_FAIL checkout became dirty during staged native build' >&2
            git status --porcelain=v1 --untracked-files=all >&2
            exit 1
          fi
          echo "W26_NAPI_BUILD_SOURCE_CLEAN_PASS native_path=$native_path"
      - name: Verify Ozone with SQLite and PGlite metadata
        env:
          MOUNT_RS_PROFILE_IO: '1'
          MOUNT_RS_OZONE_COMPOSITIONS: '1'
          MOUNT_RS_OZONE_NODE_COMPOSITION: '1'
          MOUNT_RS_OZONE_IOPS: '1'
          MOUNT_RS_OZONE_IOPS_PROVIDERS: 'mount-rs-split-sqlite-r2,mount-rs-split-pglite-r2'
          MOUNT_RS_OZONE_IOPS_OUTPUT: ${{ runner.temp }}/w26-ozone-compositions/ozone-iops.json
          MOUNT_RS_OZONE_IOPS_MIN: '1000'
          MOUNT_RS_OZONE_IOPS_ITERATIONS: '400'
          MOUNT_RS_OZONE_IOPS_CONCURRENCY: '64'
          MOUNT_RS_OZONE_IOPS_PAYLOAD_BYTES: '4096'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/w26-ozone-compositions"
          sh scripts/test-ozone-compositions.sh 2>&1 \
            | tee "$RUNNER_TEMP/w26-ozone-compositions/ozone-compositions.log"
      - name: Preserve W26 Ozone composition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w26-ozone-compositions-evidence
          path: |
            ${{ runner.temp }}/w26-ozone-compositions/ozone-compositions.log
            ${{ runner.temp }}/w26-ozone-compositions/ozone-iops.json
          if-no-files-found: error

  ozone-tidb:
    # W26.3 needs the real Ozone gateway and the durable TiDB topology in the
    # same job; the separate tidb-rustfs job intentionally uses RustFS.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install the public Node SDK test addon
        run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build the public Node SDK test addon outside the checkout
        env:
          CARGOFLAGS: --locked
        run: |
          set -eu
          napi_stage="$RUNNER_TEMP/mount-rs-napi-stage"
          mkdir -p "$napi_stage"
          pnpm --dir bindings/mount-rs-napi exec napi build \
            --platform --release --no-js --output-dir "$napi_stage"
          native_path=$(find "$napi_stage" -maxdepth 1 -type f -name '*.node' -print)
          test -n "$native_path"
          test "$(printf '%s\n' "$native_path" | wc -l | tr -d ' ')" = 1
          printf 'NAPI_RS_NATIVE_LIBRARY_PATH=%s\n' "$native_path" >> "$GITHUB_ENV"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo 'W26_NAPI_BUILD_SOURCE_CLEAN_FAIL checkout became dirty during staged native build' >&2
            git status --porcelain=v1 --untracked-files=all >&2
            exit 1
          fi
          echo "W26_NAPI_BUILD_SOURCE_CLEAN_PASS native_path=$native_path"
      - name: Verify durable TiDB metadata over Apache Ozone chunks
        env:
          MOUNT_RS_PROFILE_IO: '1'
          MOUNT_RS_OZONE_TIDB_COMPOSITION: '1'
          MOUNT_RS_TIDB_NAPI: '1'
          MOUNT_RS_TIDB_IOPS: '1'
          MOUNT_RS_TIDB_IOPS_OUTPUT: artifacts/ozone-tidb-iops.json
          MOUNT_RS_TIDB_IOPS_MIN: '1000'
          MOUNT_RS_TIDB_IOPS_ITERATIONS: '400'
          MOUNT_RS_TIDB_IOPS_CONCURRENCY: '64'
          MOUNT_RS_TIDB_IOPS_PAYLOAD_BYTES: '4096'
          MOUNT_RS_TIDB_TOPOLOGY: durable
          MOUNT_RS_TIDB_VERSION: v8.5.7
          MOUNT_RS_OZONE_COMPOSITION_TIMEOUT_SECONDS: '2400'
        run: |
          set -o pipefail
          mkdir -p artifacts
          sh scripts/test-ozone.sh 2>&1 | tee artifacts/ozone-tidb.log
      - name: Preserve W26 Ozone TiDB evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w26-ozone-tidb-evidence
          path: |
            artifacts/ozone-tidb.log
            artifacts/ozone-tidb-iops.json
          if-no-files-found: error

  ozone-foundationdb:
    # W26 requires a provider-specific Ozone packet for every feasible
    # metadata provider. Keep FoundationDB separate because its harness owns
    # a multi-container cluster and a disposable native-client image.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify durable FoundationDB metadata over Apache Ozone chunks
        env:
          MOUNT_RS_PROFILE_IO: '1'
          MOUNT_RS_OZONE_FOUNDATIONDB_COMPOSITION: '1'
          MOUNT_RS_FOUNDATIONDB_TOPOLOGY: durable
          MOUNT_RS_FOUNDATIONDB_NAPI: '1'
          MOUNT_RS_FOUNDATIONDB_IOPS: '1'
          MOUNT_RS_FOUNDATIONDB_IOPS_OUTPUT: artifacts/ozone-foundationdb-iops.json
          MOUNT_RS_FOUNDATIONDB_IOPS_MIN: '1000'
          MOUNT_RS_FOUNDATIONDB_IOPS_ITERATIONS: '400'
          MOUNT_RS_FOUNDATIONDB_IOPS_CONCURRENCY: '64'
          MOUNT_RS_FOUNDATIONDB_IOPS_PAYLOAD_BYTES: '4096'
          MOUNT_RS_OZONE_COMPOSITION_TIMEOUT_SECONDS: '2400'
        run: |
          set -o pipefail
          mkdir -p artifacts
          sh scripts/test-ozone.sh 2>&1 | tee artifacts/ozone-foundationdb.log
      - name: Preserve W26 Ozone FoundationDB evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w26-ozone-foundationdb-evidence
          path: |
            artifacts/ozone-foundationdb.log
            artifacts/ozone-foundationdb-iops.json
          if-no-files-found: error

  w26-ozone-evidence:
    # A provider job can pass while another provider, policy, recovery, or
    # cleanup surface is absent. Assemble one fail-closed packet from all W26
    # Ozone jobs before CI can report the production-readiness evidence.
    if: always()
    needs:
      - ozone
      - ozone-compositions
      - ozone-tidb
      - ozone-foundationdb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Download W26 Ozone base evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: w26-ozone-base-evidence
          path: evidence/base
      - name: Download W26 Ozone composition evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: w26-ozone-compositions-evidence
          path: evidence/compositions
      - name: Download W26 Ozone TiDB evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: w26-ozone-tidb-evidence
          path: evidence/tidb
      - name: Download W26 Ozone FoundationDB evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: w26-ozone-foundationdb-evidence
          path: evidence/foundationdb
      - name: Verify complete W26 Ozone evidence packet
        if: always()
        run: |
          set -eu
          node scripts/test-w26-ozone-evidence-packet.mjs
          node scripts/verify-w26-ozone-evidence-packet.mjs \
            --revision "$(git rev-parse HEAD)" \
            --policy-log evidence/base/ozone-policy.log \
            --base-log evidence/base/ozone-base.log \
            --compositions-log evidence/compositions/ozone-compositions.log \
            --compositions-artifact evidence/compositions/ozone-iops.json \
            --tidb-log evidence/tidb/ozone-tidb.log \
            --tidb-artifact evidence/tidb/ozone-tidb-iops.json \
            --foundationdb-log evidence/foundationdb/ozone-foundationdb.log \
            --foundationdb-artifact evidence/foundationdb/ozone-foundationdb-iops.json

  rustfs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: tests/rustfs -> target
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install real PGlite and Node factory prerequisites
        run: |
          pnpm --dir tests/pglite install --frozen-lockfile
          pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build the N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir bindings/mount-rs-napi build
      - name: Verify nested process timeout cleanup
        run: sh scripts/test-rustfs-combo-timeout.sh
      - name: Verify bounded Docker command cleanup
        run: sh scripts/test-rustfs-bounded-docker.sh
      - name: Verify real RustFS block contract and restart persistence
        run: ./scripts/test-rustfs.sh

  foundationdb-rustfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify W07 production config policy without credentials or network
        run: |
          node scripts/verify-w07-production-config.mjs \
            tests/foundationdb/production-config-policy.json
          if node scripts/verify-w07-production-config.mjs \
            tests/foundationdb/production-config-policy.invalid.json; then
            echo 'W07 production config policy accepted an insecure fixture' >&2
            exit 1
          fi
          if node scripts/verify-w07-production-config.mjs \
            tests/foundationdb/production-config-policy.invalid-lease-ttl.json; then
            echo 'W07 production config policy accepted an unsafe lease TTL fixture' >&2
            exit 1
          fi
      - name: Install real PGlite and Node factory prerequisites
        run: |
          pnpm --dir tests/pglite install --frozen-lockfile
          pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build the default N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir bindings/mount-rs-napi build
      - name: Install and verify the Linux FUSE prerequisite for the FDB CLI gate
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          command -v fusermount3
      - name: Verify FoundationDB metadata, RustFS chunks, and service restart
        env:
          RUSTFS_COMBO_NAME: foundationdb-metadata-rustfs-chunks
          RUSTFS_COMBO_TIMEOUT_SECONDS: '900'
          RUSTFS_COMBO_COMMAND: ./scripts/test-foundationdb.sh
          MOUNT_RS_FOUNDATIONDB_TOPOLOGY: durable
          MOUNT_RS_FOUNDATIONDB_NAPI: '1'
          MOUNT_RS_FOUNDATIONDB_NATIVE_CLI: '1'
        run: ./scripts/test-rustfs.sh

  tidb:
    # The durable topology requires at least 10 GiB and four CPUs. Use the
    # larger stable Ubuntu image so a capacity pass is meaningful rather than
    # silently downgrading to a single-node or underprovisioned diagnostic.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify durable TiDB, PD, and TiKV restart acceptance
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-tidb-cargo-target
        run: ./scripts/test-tidb.sh

  tidb-tls-compile:
    # This verifies that every public TiDB consumer can ship the TLS-capable
    # client graph. It is intentionally a compile gate; credentials, CA
    # policy, and a real TLS handshake remain production provider gates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Compile TLS-enabled TiDB consumers
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-tidb-tls-cargo-target
        run: |
          cargo check --locked -p mount-rs-tidb --features rustls
          cargo check --locked -p mount-rs-sdk --features rustls
          cargo check --locked -p mount-rs-cli --features rustls
          cargo check --locked -p mount-rs-napi --features rustls
      - name: Verify TLS deployment URL guardrails without credentials
        run: |
          MOUNT_RS_TIDB_TLS_VALIDATE_ONLY=1 \
          MOUNT_RS_TIDB_TLS_URL='mysql://tls-validation.invalid:4000/test?require_ssl=true&verify_ca=true&verify_identity=true' \
            ./scripts/test-tidb-tls.sh
          if MOUNT_RS_TIDB_TLS_VALIDATE_ONLY=1 \
            MOUNT_RS_TIDB_TLS_URL='mysql://tls-validation.invalid:4000/test?require_ssl=false' \
            ./scripts/test-tidb-tls.sh; then
            echo 'TLS guard accepted require_ssl=false' >&2
            exit 1
          fi
      - name: Verify W08 production config policy without credentials or network
        env:
          MOUNT_RS_TIDB_TLS_URL: mysql://tls-policy-user@tidb-policy.invalid:4000/app?require_ssl=true
        run: |
          node scripts/verify-w08-production-config.mjs \
            tests/tidb/production-config-policy.json
          if node scripts/verify-w08-production-config.mjs \
            tests/tidb/production-config-policy.invalid.json; then
            echo 'W08 production config policy accepted an insecure fixture' >&2
            exit 1
          fi

  tidb-rustfs:
    # This job keeps the real RustFS service alive while test-tidb.sh owns the
    # TiDB/PD/TiKV topology. The second composition phase reopens the scoped
    # fixture after the durable TiDB component restarts.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install real PGlite and Node factory prerequisites
        run: |
          pnpm --dir tests/pglite install --frozen-lockfile
          pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Build the N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-tidb-rustfs-cargo-target
        run: pnpm --dir bindings/mount-rs-napi build
      - name: Install and verify the Linux FUSE prerequisite for the consumer gate
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          command -v fusermount3
      - name: Verify durable TiDB metadata over RustFS chunks
        env:
          MOUNT_RS_TIDB_VERSION: v8.5.7
          MOUNT_RS_TIDB_RUSTFS_PREFIX: mount-rs-ci/tidb-rustfs/${{ github.run_id }}/${{ github.run_attempt }}
          MOUNT_RS_TIDB_CHUNKED_VOLUME_KEY: mount-rs-ci-tidb-rustfs-${{ github.run_id }}-${{ github.run_attempt }}
          MOUNT_RS_TIDB_CHUNKED_RUSTFS_FIXTURE: ${{ runner.temp }}/mount-rs-tidb-rustfs-${{ github.run_id }}-${{ github.run_attempt }}.fixture
          MOUNT_RS_TIDB_RUSTFS_SOAK_OPERATIONS: '64'
          MOUNT_RS_TIDB_RUSTFS_SOAK_CONCURRENCY: '8'
          MOUNT_RS_TIDB_RUSTFS_SOAK_PAYLOAD_BYTES: '65536'
          CARGO_TARGET_DIR: ${{ runner.temp }}/mount-rs-tidb-rustfs-cargo-target
        run: ./scripts/test-tidb-rustfs.sh

  native-webdav:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install the actual Linux WebDAV client
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y davfs2 fuse3
          test -c /dev/fuse
      - name: Build and run native WebDAV I/O
        run: |
          native_test=$(cargo test --locked -p mount-rs-webdav --test native_mount --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$native_test"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo env MOUNT_RS_WEBDAV_NATIVE_TEST=1 timeout 180s "$native_test" --ignored --nocapture
          else
            MOUNT_RS_WEBDAV_NATIVE_TEST=1 python3 -c 'import subprocess,sys; subprocess.run([sys.argv[1], "--ignored", "--nocapture"], check=True, timeout=180)' "$native_test"
          fi

  native-nfs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install the actual Linux NFS client
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common
          sudo modprobe nfs
          sudo modprobe nfsv4
      - name: Build and run privileged native NFS tests
        run: |
          native_test=$(cargo test --locked -p mount-rs-nfs --test native_mount --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$native_test"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo env MOUNT_RS_NFS_NATIVE_TEST=1 MOUNT_RS_NFS_NATIVE_V4_TEST=1 MOUNT_RS_NFS_V4_TRACE=1 timeout 240s "$native_test" --ignored --nocapture
          else
            MOUNT_RS_NFS_NATIVE_TEST=1 MOUNT_RS_NFS_NATIVE_BUSY_TEST=1 python3 -c 'import subprocess,sys; subprocess.run([sys.argv[1], "--ignored", "--nocapture"], check=True, timeout=240)' "$native_test"
          fi

      - name: Compile FoundationDB-enabled CLI NFS acceptance on macOS
        if: runner.os == 'macOS'
        run: cargo check --locked -p mount-rs-cli --features foundationdb --test native_lifecycle

      - name: Verify config-driven CLI NFS persistence and cleanup
        if: runner.os == 'macOS'
        env:
          MOUNT_RS_CLI_NATIVE_NFS: '1'
        run: python3 -c 'import subprocess; subprocess.run(["cargo", "test", "--locked", "-p", "mount-rs-cli", "--test", "native_lifecycle", "--", "--ignored", "--skip", "cli_nfs_pglite_config_binary_mounts_io_and_reopens", "--nocapture"], check=True, timeout=240)'

      - name: Verify SQLite hosting and journal support through native NFS
        run: |
          sqlite_test=$(cargo test --locked -p mount-rs-core --test native_nfs_sqlite --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$sqlite_test"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo env MOUNT_RS_RUN_NATIVE_NFS_SQLITE=1 timeout 300s "$sqlite_test" --ignored --nocapture
          else
            MOUNT_RS_RUN_NATIVE_NFS_SQLITE=1 python3 -c 'import subprocess,sys; subprocess.run([sys.argv[1], "--ignored", "--nocapture"], check=True, timeout=300)' "$sqlite_test"
          fi

      - name: Reject SQLite file bind aliases of the same inode
        if: runner.os == 'Linux'
        run: |
          sqlite_authority_test=$(cargo test --locked -p mount-rs-sqlite --lib --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$sqlite_authority_test"
          sudo timeout 60s "$sqlite_authority_test" --ignored --exact storage::tests::linux_file_bind_alias_with_one_link_cannot_reuse_bound_authority --nocapture

  native-concurrent-sqlite:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify local SQLite shared mounts and reject NFS hosted backing
        env:
          MOUNT_RS_CLI_NATIVE_NFS: '1'
          MOUNT_RS_CLI_NATIVE_SQLITE_TWO_PROCESS: '1'
          MOUNT_RS_CLI_NATIVE_SQLITE_ONE_PROCESS: '1'
          MOUNT_RS_CLI_NATIVE_SQLITE_NFS_BACKING: '1'
          MOUNT_RS_CLI_NATIVE_SQLITE_NFS_BLOCKS: '1'
        run: |
          owned_tmp=$(mktemp -d "$RUNNER_TEMP/mount-rs-concurrent-sqlite-XXXXXXXX")
          trap 'rmdir "$owned_tmp"' EXIT
          TMPDIR="$owned_tmp" python3 -c 'import os,subprocess; subprocess.run(["cargo", "test", "--locked", "-p", "mount-rs-cli", "--test", "native_two_process_sql", "--", "--ignored", "--test-threads=1", "--nocapture"], env=os.environ, check=True, timeout=540)'

  native-9p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify the actual Linux 9P kernel client
        run: |
          sudo modprobe 9p
          sudo modprobe 9pnet_fd
          test -d /sys/module/9pnet_fd
      - name: Build and run privileged native I/O and lifecycle tests
        run: |
          native_test=$(cargo test --locked -p mount-rs-9p --test native_mount --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$native_test"
          sudo env MOUNT_RS_9P_NATIVE_TEST=1 timeout 180s "$native_test" --ignored --nocapture

  aggregate-native:
    needs: [node, windows-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: ${{ runner.temp }}/mount-rs-native-artifacts
          merge-multiple: true
      - run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Check packaging validation regressions
        run: node bindings/mount-rs-napi/test/distribution-aggregate.mjs
      - name: Validate all five native distribution packages without publishing
        run: >-
          pnpm --dir bindings/mount-rs-napi run aggregate:artifacts --
          --input-dir "$RUNNER_TEMP/mount-rs-native-artifacts"
          --staging-dir "$RUNNER_TEMP/mount-rs-native-package"
          --keep-staging
      - name: Install and smoke-test a clean consumer from the staged package
        run: >-
          pnpm --dir bindings/mount-rs-napi run test:distribution:consumer --
          --package-dir "$RUNNER_TEMP/mount-rs-native-package"

  native-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install and verify the kernel FUSE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          command -v fusermount3
      - name: Exercise actual rootless kernel file operations
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 180s cargo test --locked -p mount-rs-fuse --test native_mount -- --ignored --nocapture
      - name: Build mounted backend integration test
        run: cargo test --locked -p mount-rs-core --test native_fuse_backends --no-run
      - name: Verify the auto transport facade through actual FUSE
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 120s cargo test --locked -p mount-rs-auto --test native_fuse -- --ignored --nocapture
      - name: Verify CLI mounts, SQLite service crash recovery and cleanup
        env:
          MOUNT_RS_CLI_NATIVE_FUSE: '1'
        run: |
          python3 -c 'import sqlite3; print(sqlite3.sqlite_version)'
          timeout 240s cargo test --locked -p mount-rs-cli --test native_lifecycle -- --ignored --nocapture
      - name: Verify mounted memory and persisted backend operations
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 180s cargo test --locked -p mount-rs-core --test native_fuse_backends mounted_memory_sqlite_and_object_store_match_and_persist -- --ignored --nocapture
      - name: Verify actual SQLite processes, locks, journals and process recovery
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 240s cargo test --locked -p mount-rs-core --test native_fuse_backends mounted_sqlite_engine_locks_journals_and_process_recovery -- --ignored --nocapture
      - name: Verify SQLite hosting on independent metadata and block stores
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 240s cargo test --locked -p mount-rs-core --test native_fuse_backends mounted_split_stores_host_sqlite_and_reopen -- --ignored --nocapture
      - name: Build the independent SQLite mount service
        run: cargo build --locked -p mount-rs-core --example sqlite_mount_service
      - name: Verify SQLite mount-service restart and SIGKILL recovery
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 480s cargo test --locked -p mount-rs-core --test sqlite_service_crash -- --ignored --nocapture
      - name: Verify real SQLite recovery from split backend failures
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
        run: timeout 300s cargo test --locked -p mount-rs-core --test sqlite_backend_faults -- --ignored --nocapture
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - run: pnpm --dir tests/pglite install --frozen-lockfile
      - name: Verify real PGlite through mounted kernel operations
        env:
          MOUNT_RS_RUN_NATIVE_FUSE: '1'
          MOUNT_RS_PGLITE_TEST_SCOPE: native-fuse
        run: timeout 480s ./scripts/test-pglite.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Keep a hung workspace test from holding a non-cancelling qualification
    # forever. Recent successful matrix jobs complete in a few minutes; this
    # leaves room for a cold cache while producing a terminal diagnostic.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --all -- --check
      # Native optional providers have separate client/runtime gates. Keeping
      # this matrix feature-off prevents a client-free macOS/Linux runner from
      # attempting to link libfdb_c while still checking every workspace target.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  kani-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Verify core single-extent bounds
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          args: '-p mount-rs-core --harness single_extent_validation'

  kani-current-create-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Prove bounded current fresh create rebase helper
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          args: '-p mount-rs-chunked --harness current_fresh_create_rebinds_only_eligible_preparation'

  http-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify HTTP health/readiness and telemetry consumers
        run: cargo test --locked -p mount-rs-http --all-features
      - name: Verify HTTP observability lint
        run: cargo clippy --locked -p mount-rs-http --all-targets --all-features -- -D warnings

  observability-qualification:
    name: Observability qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Run the locked observability qualification command set
        shell: bash
        run: |
          set -eu
          ./scripts/cargo-shared fmt --all -- --check
          ./scripts/cargo-shared check --workspace --locked
          ./scripts/cargo-shared test -p mount-rs-observability --all-features --locked
          ./scripts/cargo-shared test -p mount-rs-sdk --features observability --locked
          ./scripts/cargo-shared test -p mount-rs-http --features observability-otlp --test http_integration --locked
          ./scripts/cargo-shared test -p mount-rs-cli --features observability --locked
          ./scripts/cargo-shared check -p mount-rs-napi --features observability --locked
          ./scripts/cargo-shared clippy -p mount-rs-observability --all-features --all-targets --locked -- -D warnings
      - name: Verify authentication stage accounting controls
        timeout-minutes: 5
        run: ./scripts/cargo-shared test --locked -p mount-rs-service --features io-profiling --lib server::diagnostics::tests::auth_stage_ -- --nocapture
      - name: Verify isolated RustFS diagnostic export controls
        timeout-minutes: 5
        shell: bash
        run: |
          MOUNT_RS_PROFILE_IO=1 ./scripts/cargo-shared test --locked -p mount-rs-napi --lib \
            tests::live_rustfs_diagnostics_register_export_and_retire_without_backend_io -- --ignored --exact
          MOUNT_RS_PROFILE_IO=0 ./scripts/cargo-shared test --locked -p mount-rs-napi --lib \
            tests::disabled_rustfs_diagnostics_do_not_register_instances -- --ignored --exact
      - name: Verify native split namespace presence controls
        timeout-minutes: 5
        run: ./scripts/cargo-shared test --locked -p mount-rs-napi --lib namespace_presence::tests
      - name: Verify warmed storage diagnostic allocations
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test --locked -p mount-rs-core --test storage_diagnostics_allocations \
            -- --ignored --exact warmed_core_spans_record_without_added_allocations --nocapture \
            2>&1 | tee "$RUNNER_TEMP/storage-diagnostic-allocations.log"
      - name: Verify dedicated filesystem causal metrics
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-chunked --test filesystem_causal_metrics \
            --locked --offline -- --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/filesystem-causal-metrics.log"
      - name: Verify compact SQLite stage metrics
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-sqlite --lib --locked --offline \
            -- --ignored --exact storage::compact_tests::compact_profile_stages_account_for_selected_full_and_failed_decode \
            --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/sqlite-compact-stage-metrics.log"
          rg -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/sqlite-compact-stage-metrics.log"
      - name: Verify own-process OS I/O boundary metrics
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          unset MOUNT_RS_PROFILE_BLOCK_DEVICE MOUNT_RS_PROFILE_IOREGISTRY_ENTRY_ID
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-service --features resource-profiling \
            --test quic_tidb_saturation --locked --offline \
            -- --ignored --exact resource_profile::device_io::own_process_os_io_boundary_retains_native_identity_and_observer_cost \
            --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/process-os-io-boundary.log"
          rg -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/process-os-io-boundary.log"
      - name: Verify warmed causal profile allocations
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-core --test filesystem_causal_profile_allocations \
            --locked --offline -- --ignored --exact warmed_causal_profile_rows_record_without_added_allocations --nocapture \
            2>&1 | tee "$RUNNER_TEMP/filesystem-causal-profile-allocations.log"
      - name: Verify compact snapshot revision regressions
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-chunked --test compact_snapshot_revision \
            --locked --offline -- --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/compact-snapshot-revision.log"
      - name: Verify current-path fresh create rebase controls
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-chunked --test current_path_create_rebase \
            --locked --offline -- --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/current-path-create-rebase.log"
      - name: Verify fresh create guard predicate accounting
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-chunked --lib --locked --offline \
            -- --ignored --exact create_guard_metrics_tests::fresh_create_guard_records_overlapping_predicates --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/filesystem-create-guard-metrics.log"
      - name: Verify causal helper lifecycle accounting
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=0 \
            ./scripts/cargo-shared test -p mount-rs-chunked --lib --locked --offline \
            -- --ignored --exact causal_metrics::tests::helper_terminal_outcomes_and_drop_partition_once --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/filesystem-causal-helpers.log"
      - name: Verify causal profile slow records
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          MOUNT_RS_PROFILE_IO=1 MOUNT_RS_TRACE_REQUESTS=0 MOUNT_RS_TRACE_STORAGE=1 \
            ./scripts/cargo-shared test -p mount-rs-core --test filesystem_causal_profile_allocations \
            --locked --offline -- --ignored --exact causal_profile_slow_span_emits_fixed_stderr --quiet --nocapture \
            2>&1 | tee "$RUNNER_TEMP/filesystem-causal-profile-slow.log"
          slow_record_found=0
          slow_record_pattern='^MOUNT_RS_PROFILE_SLOW event=filesystem\.block_put\.initial elapsed_us=[1-9][0-9]{5,} units=4$'
          while IFS= read -r line; do
            if [[ "$line" =~ $slow_record_pattern ]]; then
              slow_record_found=1
            fi
          done < "$RUNNER_TEMP/filesystem-causal-profile-slow.log"
          test "$slow_record_found" -eq 1
      - name: Retain storage allocation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-allocation-controls-${{ github.event_name }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/storage-diagnostic-allocations.log
            ${{ runner.temp }}/filesystem-causal-metrics.log
            ${{ runner.temp }}/sqlite-compact-stage-metrics.log
            ${{ runner.temp }}/process-os-io-boundary.log
            ${{ runner.temp }}/filesystem-causal-profile-allocations.log
            ${{ runner.temp }}/compact-snapshot-revision.log
            ${{ runner.temp }}/current-path-create-rebase.log
            ${{ runner.temp }}/filesystem-create-guard-metrics.log
            ${{ runner.temp }}/filesystem-causal-helpers.log
            ${{ runner.temp }}/filesystem-causal-profile-slow.log
          if-no-files-found: warn
          retention-days: 14

  windows-node:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pithings/mountx
          ref: 85361a8212ff9bff8e69f62fa8993ef2c2ec51e8
          path: mountx-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify bounded network test progress
        timeout-minutes: 1
        run: node --test --test-timeout=10000 bindings/mount-rs-napi/test/network-progress.test.mjs
      - name: Verify bounded HTTP fixture progress
        timeout-minutes: 1
        run: node --test --test-timeout=10000 scripts/http-fixture-progress.test.mjs scripts/http-fixture-launch.test.mjs
      - name: Verify bounded PGlite startup checkpoints
        timeout-minutes: 1
        run: node --test --test-timeout=10000 tests/pglite/startup-progress.test.mjs
      - name: Verify persisted layout evidence controls
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/compact-layout.test.mjs benchmarks/storage/compact-layout-runner.test.mjs bindings/mount-rs-napi/test/compact-layout-postlude.mjs
      - name: Verify explicit RustFS benchmark configuration
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/rustfs-provider.test.mjs
      - name: Verify split namespace presence receipt controls
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/namespace-presence.test.mjs bindings/mount-rs-napi/test/namespace-presence-postlude.test.mjs
      - name: Verify owned layout comparison and bottleneck metrics controls
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/owned-layout-arm.test.mjs benchmarks/storage/owned-layout-outcome.test.mjs benchmarks/storage/owned-layout-comparison.test.mjs benchmarks/storage/owned-layout-metrics.test.mjs benchmarks/storage/process-resource-metrics.test.mjs
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Install pinned oracle dependencies without lifecycle scripts
        run: pnpm --dir mountx-source install --frozen-lockfile --ignore-scripts
      - name: Build the Windows N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir bindings/mount-rs-napi build
      - name: Verify portable Windows N-API parity against the pinned oracle
        env:
          MOUNTX_SOURCE: ${{ github.workspace }}/mountx-source
          MOUNT_RS_WEBDAV_PROVIDER_NETWORK_TIMEOUT_MS: '60000'
        run: pnpm --dir bindings/mount-rs-napi test
      - name: Verify Windows structural-driver adapter harness
        run: node bindings/mount-rs-napi/test/structural-native.mjs
      - name: Verify native Windows Node factories and chunked storage
        run: |
          node bindings/mount-rs-napi/test/factories.mjs
          node bindings/mount-rs-napi/test/chunked.mjs
          node bindings/mount-rs-napi/test/shutdown-lifecycle.mjs
          node bindings/mount-rs-napi/test/namespace-presence.mjs
      - name: Verify Windows virtual filesystem consumers and declarations
        run: |
          pnpm --dir bindings/mount-rs-virtual-fs install --frozen-lockfile --ignore-scripts
          pnpm --dir bindings/mount-rs-virtual-fs test
          pnpm --dir bindings/mount-rs-virtual-fs typecheck

      - name: Verify Windows package distribution
        run: node bindings/mount-rs-napi/test/distribution.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-win32-x64-msvc
          path: bindings/mount-rs-napi/mount-rs.win32-x64-msvc.node
          if-no-files-found: error

  node:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pithings/mountx
          ref: 85361a8212ff9bff8e69f62fa8993ef2c2ec51e8
          path: mountx-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify bounded network test progress
        timeout-minutes: 1
        run: node --test --test-timeout=10000 bindings/mount-rs-napi/test/network-progress.test.mjs
      - name: Verify bounded HTTP fixture progress
        timeout-minutes: 1
        run: node --test --test-timeout=10000 scripts/http-fixture-progress.test.mjs scripts/http-fixture-launch.test.mjs
      - name: Verify bounded PGlite startup checkpoints
        timeout-minutes: 1
        run: node --test --test-timeout=10000 tests/pglite/startup-progress.test.mjs
      - name: Verify persisted layout evidence controls
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/compact-layout.test.mjs benchmarks/storage/compact-layout-runner.test.mjs bindings/mount-rs-napi/test/compact-layout-postlude.mjs
      - name: Verify explicit RustFS benchmark configuration
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/rustfs-provider.test.mjs
      - name: Verify split namespace presence receipt controls
        timeout-minutes: 1
        run: node --test --test-timeout=10000 benchmarks/storage/namespace-presence.test.mjs bindings/mount-rs-napi/test/namespace-presence-postlude.test.mjs
      - name: Verify owned layout comparison and bottleneck metrics controls
        timeout-minutes: 1
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=10000 benchmarks/storage/owned-layout-arm.test.mjs benchmarks/storage/owned-layout-outcome.test.mjs benchmarks/storage/owned-layout-comparison.test.mjs benchmarks/storage/owned-layout-metrics.test.mjs benchmarks/storage/process-resource-metrics.test.mjs benchmarks/storage/owned-layout-entry.test.mjs scripts/verify-owned-layout-comparison.test.mjs 2>&1 | tee "$RUNNER_TEMP/owned-layout-controls.log"
      - name: Verify receipt producers and readonly handoff CLI
        timeout-minutes: 1
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=10000 scripts/owned-layout-handoff.test.mjs scripts/owned-layout-handoff-cli.test.mjs 2>&1 | tee "$RUNNER_TEMP/owned-layout-handoff-controls.log"
      - name: Verify FoundationDB diagnostic coverage controls
        timeout-minutes: 1
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=10000 benchmarks/storage/foundationdb-diagnostics.test.mjs 2>&1 | tee "$RUNNER_TEMP/foundationdb-diagnostic-controls.log"
      - name: Verify owned process receipt models
        timeout-minutes: 1
        run: |
          set -o pipefail
          python3 -B scripts/owned-layout-process.test.py 2>&1 | tee "$RUNNER_TEMP/owned-layout-process-controls.log"
      - name: Verify private process receipt publication
        timeout-minutes: 1
        run: |
          set -o pipefail
          python3 -B scripts/owned-layout-process-writer.test.py 2>&1 | tee "$RUNNER_TEMP/owned-layout-process-writer-controls.log"
      - name: Retain owned layout control diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-layout-controls-${{ github.event_name }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/owned-layout-controls.log
            ${{ runner.temp }}/owned-layout-handoff-controls.log
            ${{ runner.temp }}/foundationdb-diagnostic-controls.log
            ${{ runner.temp }}/owned-layout-process-controls.log
            ${{ runner.temp }}/owned-layout-process-writer-controls.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify guarded backing observer and pilot controls
        timeout-minutes: 2
        run: |
          env -u NAPI_RS_FORCE_WASI -u NAPI_RS_WASI_FLAVOR -u NODE_PATH \
            -u MOUNT_RS_PROFILE_IO -u MOUNT_RS_TRACE_STORAGE \
            NAPI_RS_NATIVE_LIBRARY_PATH="$GITHUB_WORKSPACE/benchmarks/storage/capture-native.cjs" \
            node --test --test-concurrency=1 --test-timeout=10000 \
            benchmarks/storage/backing-observer.test.mjs \
            benchmarks/storage/backing-engine-transport.test.mjs \
            benchmarks/storage/owned-backing-pilot.test.mjs \
            benchmarks/storage/owned-backing-pilot-entry.test.mjs \
            scripts/verify-owned-backing-pilot.test.mjs
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - run: pnpm --dir bindings/mount-rs-napi install --frozen-lockfile
      - name: Install pinned oracle dependencies without lifecycle scripts
        run: pnpm --dir mountx-source install --frozen-lockfile --ignore-scripts
      - name: Build the N-API addon with the locked Rust graph
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir bindings/mount-rs-napi build
      - name: Verify native namespace presence configuration rejection
        timeout-minutes: 1
        run: node bindings/mount-rs-napi/test/namespace-presence.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" pnpm --dir bindings/mount-rs-napi test
      - name: Verify real just-bash and Mastra consumers
        timeout-minutes: 5
        run: |
          pnpm --dir bindings/mount-rs-virtual-fs install --frozen-lockfile --ignore-scripts
          pnpm --dir bindings/mount-rs-virtual-fs test
          pnpm --dir bindings/mount-rs-virtual-fs typecheck
      - name: Verify storage benchmark harness and smoke workload
        timeout-minutes: 5
        run: |
          node benchmarks/storage/test.mjs
          MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node benchmarks/storage/runner.mjs --smoke --output artifacts/storage-smoke.json
      - name: Preserve storage benchmark samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-smoke-${{ matrix.os }}
          path: artifacts/storage-smoke.json
          if-no-files-found: warn
      - name: Install native Node mount prerequisites on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          command -v fusermount3
      - name: Verify real Node addon mounted I/O and cleanup
        env:
          MOUNT_RS_NAPI_NATIVE_MOUNT: '1'
        run: python3 -c 'import subprocess; subprocess.run(["node", "bindings/mount-rs-napi/test/native.mjs"], check=True, timeout=180)'
      - name: Verify Node SDK CLI native mount on Linux FUSE or macOS NFS
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 5
        env:
          MOUNT_RS_NODE_CLI_NATIVE_INTEGRATION: '1'
        run: python3 -c 'import subprocess; subprocess.run(["node", "examples/node-cli/native-integration.mjs"], check=True, timeout=240)'
      - name: Verify structural-driver native mount lifecycle on Linux FUSE
        if: runner.os == 'Linux'
        env:
          MOUNT_RS_NAPI_STRUCTURAL_NATIVE_MOUNT: '1'
          MOUNT_RS_NAPI_STRUCTURAL_TRANSPORT: fuse
        run: python3 -c 'import subprocess; subprocess.run(["node", "bindings/mount-rs-napi/test/structural-native.mjs"], check=True, timeout=180)'
      - name: Verify structural-driver native mount lifecycle on macOS
        if: runner.os == 'macOS'
        env:
          MOUNT_RS_NAPI_STRUCTURAL_NATIVE_MOUNT: '1'
        run: python3 -c 'import subprocess; subprocess.run(["node", "bindings/mount-rs-napi/test/structural-native.mjs"], check=True, timeout=180)'
      - run: pnpm --dir tests/upstream install --frozen-lockfile
      - name: Precompile conformance and HTTP fixtures in the shared target
        timeout-minutes: 15
        run: |
          ./scripts/cargo-shared build --locked --example http_oracle --example p9_oracle --example nfs_oracle
          ./scripts/cargo-shared test --locked --example http_oracle -- http_fixture_progress_tests
      - name: Run the unmodified upstream driver conformance suite
        # Both fixture modules retain their 180-second build limits and use
        # the locked default-profile artifacts precompiled above.
        timeout-minutes: 10
        run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" pnpm --dir tests/upstream test
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-kv-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-http-parity.mjs
      - name: Verify fragmented request early rejection
        timeout-minutes: 5
        run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/test-http-early-rejection.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-edge-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-flags-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-auto-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-host-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-trace-parity.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-fuse-inodes.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-fuse-init.mjs
      - run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" node scripts/check-fuse-session.mjs
      - run: pnpm --dir tests/pglite install --frozen-lockfile
      - name: Verify provider matrix CLI process helper
        env:
          MOUNT_RS_TEST_POSIX_GROUP_SIGNALS: '1'
        run: node --test tests/provider_matrix/cli-run.test.mjs
      - name: Precompile PGlite provider matrix and Rust CLI
        # The timed fixture runs the standalone matrix binary, the root CLI,
        # and two filtered CLI lib tests with these graphs and shared target.
        timeout-minutes: 15
        run: |
          ./scripts/cargo-shared build --locked --manifest-path tests/provider_matrix/Cargo.toml
          ./scripts/cargo-shared build --locked -p mount-rs-cli
          ./scripts/cargo-shared test --no-run --lib --locked -p mount-rs-cli
      - name: Verify PGlite integration and restart recovery
        timeout-minutes: 10
        run: MOUNTX_SOURCE="$GITHUB_WORKSPACE/mountx-source" ./scripts/test-pglite.sh
      - name: Benchmark real volatile PGlite providers
        timeout-minutes: 5
        run: MOUNT_RS_PGLITE_TEST_SCOPE=benchmark ./scripts/test-pglite.sh
      - name: Preserve PGlite benchmark samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-pglite-smoke-${{ matrix.os }}
          path: artifacts/storage-pglite-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}
          path: bindings/mount-rs-napi/*.node
          if-no-files-found: error
