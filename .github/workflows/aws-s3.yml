name: Live AWS S3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-s3.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/mount-rs-cli/**'
      - 'crates/mount-rs-sdk/**'
      - 'crates/mount-rs-core/**'
      - 'integrations/mount-rs-persist/**'
      - 'integrations/mount-rs-pglite/**'
      - 'integrations/mount-rs-r2/**'
      - 'transports/mount-rs-s3/**'
      - 'infra/aws-s3-production.yaml'
      - 'scripts/audit-aws-s3-bucket-policy.sh'
      - 'scripts/audit-aws-s3-ci-oidc.sh'
      - 'scripts/check-aws-s3-ci-environment.jq'
      - 'scripts/audit-aws-s3-resource.sh'
      - 'scripts/cargo-shared*'
      - 'scripts/check-aws-s3-bucket-policy.jq'
      - 'scripts/test-aws-s3.sh'
      - 'scripts/test-aws-s3-bucket-policy.sh'
      - 'scripts/test-aws-s3-ci-config.sh'
      - 'scripts/test-aws-s3-ci-environment.sh'
      - 'scripts/test-aws-s3-ci-provenance.sh'
      - 'scripts/test-aws-s3-test-config.sh'
      - 'scripts/test-aws-s3-test-identity.sh'
      - 'scripts/test-aws-s3-production-template.rb'
      - 'scripts/test-aws-s3-pglite.sh'
      - 'scripts/test-s3-provider-workflow-paths.sh'
      - 'scripts/validate-aws-s3-ci-config.sh'
      - 'scripts/validate-aws-s3-ci-provenance.sh'
      - 'scripts/validate-aws-s3-test-config.sh'
      - 'scripts/validate-aws-s3-test-identity.sh'
      - 'tests/aws/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-aws-s3
  cancel-in-progress: false

jobs:
  live-aws-s3:
    name: Rust SDK, CLI, and service acceptance
    # Configure this protected environment with the bucket/region variables
    # and an OIDC-trusted short-lived role before enabling the job.
    environment: aws-s3-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_S3_TEST_BUCKET: ${{ vars.MOUNT_RS_AWS_S3_TEST_BUCKET }}
      AWS_S3_TEST_REGION: ${{ vars.MOUNT_RS_AWS_S3_TEST_REGION }}
      AWS_S3_TEST_EXPECTED_ACCOUNT_ID: ${{ vars.MOUNT_RS_AWS_S3_ACCOUNT_ID }}
      AWS_S3_CI_EXPECTED_ACCOUNT_ID: ${{ vars.MOUNT_RS_AWS_S3_ACCOUNT_ID }}
      AWS_S3_TEST_VERSIONING_STATUS: ${{ vars.MOUNT_RS_AWS_S3_TEST_VERSIONING_STATUS }}
      AWS_DEFAULT_REGION: ${{ vars.MOUNT_RS_AWS_S3_TEST_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      MOUNT_RS_RUN_AWS_S3: '1'
      MOUNT_RS_AWS_S3_TEST_PREFIX: mount-rs-tests/aws-s3/ci/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - name: Verify S3 provider workflow trigger coverage
        run: sh scripts/test-s3-provider-workflow-paths.sh

      - name: Capture locked AWS S3 qualification provenance
        run: |
          source_sha=$(git rev-parse HEAD)
          working_tree=$(git status --porcelain=v1)
          test -z "$working_tree"
          mkdir -p artifacts/aws-s3
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_subject=%s\n' "$(git log -1 --format=%s)"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'ruby=%s\n' "$(ruby --version)"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'working_tree=clean\n'
          } > artifacts/aws-s3/provenance.txt
          cargo metadata --locked --no-deps --format-version 1 > artifacts/aws-s3/cargo-metadata.json
          cargo metadata --manifest-path tests/aws/Cargo.toml --locked --no-deps --format-version 1 > artifacts/aws-s3/aws-test-cargo-metadata.json
          sha256sum Cargo.lock infra/aws-s3-production.yaml \
            scripts/validate-aws-s3-ci-config.sh \
            scripts/test-aws-s3-ci-config.sh \
            scripts/test-aws-s3-ci-environment.sh \
            scripts/test-aws-s3-ci-provenance.sh \
            scripts/test-aws-s3-test-config.sh \
            scripts/test-aws-s3-test-identity.sh \
            scripts/validate-aws-s3-test-config.sh \
            scripts/validate-aws-s3-test-identity.sh \
            scripts/validate-aws-s3-ci-provenance.sh \
            scripts/check-aws-s3-bucket-policy.jq \
            scripts/test-aws-s3-bucket-policy.sh \
            scripts/test-aws-s3-production-template.rb \
            scripts/audit-aws-s3-resource.sh \
            scripts/audit-aws-s3-bucket-policy.sh \
            scripts/audit-aws-s3-ci-oidc.sh \
            scripts/check-aws-s3-ci-environment.jq \
            scripts/test-aws-s3.sh \
            scripts/test-aws-s3-pglite.sh \
            scripts/test-s3-provider-workflow-paths.sh \
            tests/aws/Cargo.toml \
            tests/aws/Cargo.lock \
            .github/workflows/aws-s3.yml > artifacts/aws-s3/input-sha256sums.txt

      - name: Validate locked AWS S3 qualification provenance
        run: ./scripts/validate-aws-s3-ci-provenance.sh artifacts/aws-s3/provenance.txt

      - name: Test AWS S3 qualification provenance contract
        run: ./scripts/test-aws-s3-ci-provenance.sh

      - name: Test protected AWS S3 CI configuration validator
        run: ./scripts/test-aws-s3-ci-config.sh

      - name: Test production AWS S3 bucket policy contract
        run: ./scripts/test-aws-s3-bucket-policy.sh

      - name: Test production AWS S3 CloudFormation contract
        run: ruby scripts/test-aws-s3-production-template.rb

      - name: Test protected AWS S3 environment contract
        run: ./scripts/test-aws-s3-ci-environment.sh

      - name: Test AWS S3 harness credential/configuration contract
        run: ./scripts/test-aws-s3-test-config.sh

      - name: Test AWS S3 caller-account binding contract
        run: ./scripts/test-aws-s3-test-identity.sh

      - name: Validate protected AWS S3 CI configuration
        env:
          AWS_S3_CI_ROLE_ARN: ${{ secrets.MOUNT_RS_AWS_S3_CI_ROLE_ARN }}
        run: ./scripts/validate-aws-s3-ci-config.sh

      - name: Configure short-lived AWS workload credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ vars.MOUNT_RS_AWS_S3_TEST_REGION }}
          role-to-assume: ${{ secrets.MOUNT_RS_AWS_S3_CI_ROLE_ARN }}
          role-session-name: mount-rs-aws-s3-${{ github.run_id }}

      - name: Verify AWS identity and CLI
        run: |
          aws --version
          aws sts get-caller-identity

      - name: Run bounded AWS S3 acceptance
        run: |
          set -o pipefail
          ./scripts/test-aws-s3.sh 2>&1 | tee artifacts/aws-s3/acceptance.log

      - name: Upload AWS S3 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-s3-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/aws-s3
          if-no-files-found: ignore
          retention-days: 14
