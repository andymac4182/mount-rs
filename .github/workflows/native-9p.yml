name: Native 9P

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-9p.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/cargo-shared'
      - 'scripts/cargo-shared-env.sh'
      - 'transports/mount-rs-9p/**'
      - 'transports/mount-rs-auto/**'
      - 'integrations/mount-rs-napi/**'
  pull_request:
    paths:
      - '.github/workflows/native-9p.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/cargo-shared'
      - 'scripts/cargo-shared-env.sh'
      - 'transports/mount-rs-9p/**'
      - 'transports/mount-rs-auto/**'
      - 'integrations/mount-rs-napi/**'

concurrency:
  group: native-9p-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-9p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify the actual Linux 9P kernel client
        run: |
          sudo modprobe 9p
          sudo modprobe 9pnet_fd
          test -d /sys/module/9pnet_fd
      - name: Build and run privileged native I/O and lifecycle tests
        run: |
          native_test=$(./scripts/cargo-shared test --locked -p mount-rs-9p --test native_mount --no-run --message-format=json | python3 -c 'import json,sys; print([x["executable"] for line in sys.stdin if (x:=json.loads(line)).get("executable")][0])')
          test -x "$native_test"
          sudo env MOUNT_RS_9P_NATIVE_TEST=1 timeout 180s "$native_test" --ignored --nocapture

  napi-native-9p:
    name: N-API native 9P lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify the actual Linux 9P kernel client for N-API
        run: |
          sudo modprobe 9p
          sudo modprobe 9pnet_fd
          test -d /sys/module/9p
          test -d /sys/module/9pnet_fd
      - name: Install the public Node SDK test addon
        run: pnpm --dir integrations/mount-rs-napi install --frozen-lockfile
      - name: Build the public Node SDK test addon
        env:
          CARGOFLAGS: --locked
        run: pnpm --dir integrations/mount-rs-napi build
      - name: Verify N-API 9P server and attached-stream lifecycle
        run: MOUNT_RS_SERVER_PHASE=p9 node integrations/mount-rs-napi/test/servers.mjs
      - name: Verify direct N-API 9P session lifecycle
        run: node integrations/mount-rs-napi/test/p9-session.mjs
      - name: Verify N-API 9P server and connection member surface
        run: node integrations/mount-rs-napi/test/p9-server-members.mjs
      - name: Verify automatic N-API 9P mounted I/O and cleanup
        run: |
          node_path=$(command -v node)
          sudo env "PATH=$PATH" \
            MOUNT_RS_NAPI_NATIVE_MOUNT=1 \
            MOUNT_RS_NAPI_TRANSPORT=9p \
            timeout 180s "$node_path" integrations/mount-rs-napi/test/native.mjs
      - name: Verify direct ./9p N-API mounted I/O and cleanup
        run: |
          node_path=$(command -v node)
          sudo env "PATH=$PATH" \
            MOUNT_RS_NAPI_P9_NATIVE_MOUNT=1 \
            timeout 180s "$node_path" integrations/mount-rs-napi/test/p9-native.mjs
      - name: Verify structural-driver N-API 9P mounted I/O and cleanup
        run: |
          node_path=$(command -v node)
          sudo env "PATH=$PATH" \
            MOUNT_RS_NAPI_STRUCTURAL_NATIVE_MOUNT=1 \
            MOUNT_RS_NAPI_STRUCTURAL_TRANSPORT=9p \
            timeout 180s "$node_path" integrations/mount-rs-napi/test/structural-native.mjs
