name: Metric Publication Probe

on:
  push:
    branches:
      - codex/full-target-evidence-probe-20260930-1106
    paths:
      - crates/mount-rs-service/tests/support/production_target/metrics.rs
      - .github/workflows/metric-publication-probe.yml

permissions:
  contents: read

jobs:
  limits:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
      - name: Bind the bounded publisher source
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s\nCARGO_TERM_COLOR=never\n' "$RUNNER_TEMP/metric-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path('crates/mount-rs-service/tests/support/production_target/metrics.rs').read_bytes()
          if hashlib.sha256(source).hexdigest() != '46e39eea032f706e03af08ec146335dc2883a6c1fe280ae6a1b16b11ff3a738b':
              raise SystemExit('Metric publisher source differs from the GREEN fixture')
          PY
      - name: Verify formatting
        run: ./scripts/cargo-shared fmt --all -- --check
      - name: Verify all metric evidence controls and bounded publication
        run: |
          ./scripts/cargo-shared test --locked -p mount-rs-service --features sdk-runtime,resource-profiling --test quic_production_target target::metrics::tests:: -- --nocapture
      - name: Verify strict metric fixture Clippy
        run: ./scripts/cargo-shared clippy --locked -p mount-rs-service --features sdk-runtime,resource-profiling --test quic_production_target -- -D warnings
