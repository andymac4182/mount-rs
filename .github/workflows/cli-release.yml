name: Publish CLI preview release

on:
  push:
    tags:
      - 'v*-cli-preview*'

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'andymac4182/mount-rs'
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - name: Test and package the CLI
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "mount-rs-cli"))')"

          case "$release_tag" in
            "v${package_version}"-cli-*) ;;
            *)
              echo "Release tag $release_tag does not match mount-rs-cli version $package_version" >&2
              exit 1
              ;;
          esac

          git fetch --no-tags origin main
          release_commit="$(git rev-parse "${release_tag}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Refusing to publish: $release_tag is not reachable from origin/main" >&2
            exit 1
          fi

          target="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$target" != "aarch64-apple-darwin" ]; then
            echo "Refusing to publish: expected the verified Apple Silicon target, got $target" >&2
            exit 1
          fi

          cargo test --locked -p mount-rs-cli --all-targets
          cargo build --locked --release -p mount-rs-cli

          version_output="$(target/release/mount-rs --version)"
          test "$version_output" = "mount-rs $package_version"

          release_dir="$RUNNER_TEMP/mount-rs-cli-release"
          mkdir -p "$release_dir"
          artifact="mount-rs-${package_version}-${target}.tar.gz"
          cp target/release/mount-rs "$release_dir/mount-rs"
          chmod 755 "$release_dir/mount-rs"
          COPYFILE_DISABLE=1 tar -czf "$release_dir/$artifact" -C "$release_dir" mount-rs

          node scripts/write-w08-release-manifest.mjs \
            --artifact "$release_dir/$artifact" \
            --output "$release_dir/release-manifest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$release_commit" \
            --version "$package_version" \
            --tag "$release_tag" \
            --target "$target" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID"
          node scripts/verify-w08-release-manifest.mjs \
            "$release_dir/release-manifest.json" \
            "$release_dir/$artifact"
          cargo metadata --locked --format-version 1 > "$release_dir/cargo-metadata.json"
          node scripts/write-w08-release-sbom.mjs \
            --metadata "$release_dir/cargo-metadata.json" \
            --output "$release_dir/release-sbom.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$release_commit" \
            --package mount-rs-cli \
            --version "$package_version" \
            --artifact "$release_dir/$artifact"
          node scripts/verify-w08-release-sbom.mjs \
            --sbom "$release_dir/release-sbom.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$release_commit" \
            --package mount-rs-cli \
            --version "$package_version" \
            --artifact "$release_dir/$artifact"
          (cd "$release_dir" && shasum -a 256 "$artifact" release-manifest.json release-sbom.json > SHA256SUMS)
          (cd "$release_dir" && shasum -a 256 -c SHA256SUMS)

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "manifest=release-manifest.json" >> "$GITHUB_OUTPUT"
          echo "sbom=release-sbom.json" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Generate artifact provenance attestation
        id: provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/mount-rs-cli-release/${{ steps.package.outputs.artifact }}

      - name: Generate CycloneDX SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/mount-rs-cli-release/${{ steps.package.outputs.artifact }}
          sbom-path: ${{ runner.temp }}/mount-rs-cli-release/${{ steps.package.outputs.sbom }}

      - name: Verify hosted release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          RELEASE_COMMIT: ${{ steps.package.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/mount-rs-cli-release"
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/cli-release.yml"
          common_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$signer_workflow"
            --source-digest "$RELEASE_COMMIT"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
            --format json
          )

          gh attestation verify "$release_dir/$ARTIFACT" \
            "${common_args[@]}" \
            > "$release_dir/provenance-attestation.json"
          gh attestation verify "$release_dir/$ARTIFACT" \
            "${common_args[@]}" \
            --predicate-type https://cyclonedx.org/bom \
            > "$release_dir/sbom-attestation.json"
          node -e 'for (const path of process.argv.slice(1)) JSON.parse(require("node:fs").readFileSync(path, "utf8"));' \
            "$release_dir/provenance-attestation.json" \
            "$release_dir/sbom-attestation.json"

          node scripts/write-w08-release-manifest.mjs \
            --artifact "$release_dir/$ARTIFACT" \
            --output "$release_dir/release-manifest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$RELEASE_COMMIT" \
            --version "${{ steps.package.outputs.package_version }}" \
            --tag "$GITHUB_REF_NAME" \
            --target "${{ steps.package.outputs.target }}" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --signature-status verified \
            --sbom-status verified
          node scripts/verify-w08-release-manifest.mjs \
            "$release_dir/release-manifest.json" \
            "$release_dir/$ARTIFACT"
          node scripts/verify-w08-release-sbom.mjs \
            --sbom "$release_dir/${{ steps.package.outputs.sbom }}" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$RELEASE_COMMIT" \
            --package mount-rs-cli \
            --version "${{ steps.package.outputs.package_version }}" \
            --artifact "$release_dir/$ARTIFACT"
          (cd "$release_dir" && shasum -a 256 "$ARTIFACT" release-manifest.json release-sbom.json > SHA256SUMS)
          (cd "$release_dir" && shasum -a 256 -c SHA256SUMS)
          echo "W08_RELEASE_ATTESTATION_PASS artifact=$ARTIFACT source=$RELEASE_COMMIT"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          release_dir="$RUNNER_TEMP/mount-rs-cli-release"
          artifact="${{ steps.package.outputs.artifact }}"
          manifest="${{ steps.package.outputs.manifest }}"
          sbom="${{ steps.package.outputs.sbom }}"
          package_version="${{ steps.package.outputs.package_version }}"
          release_commit="${{ steps.package.outputs.release_commit }}"
          target="${{ steps.package.outputs.target }}"
          notes="CLI preview built from commit $release_commit.

          Published target: $target
          Published artifact: $artifact
          Checksums: SHA256SUMS
          GitHub Sigstore provenance and CycloneDX SBOM attestations were generated and verified in this workflow.

          This is a platform-specific CLI preview. It is not a complete platform matrix and does not imply overall project release readiness."

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              "$release_dir/$artifact" \
              "$release_dir/SHA256SUMS" \
              "$release_dir/$manifest" \
              "$release_dir/$sbom" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" \
              "$release_dir/$artifact" \
              "$release_dir/SHA256SUMS" \
              "$release_dir/$manifest" \
              "$release_dir/$sbom" \
              --repo "$GITHUB_REPOSITORY" \
              --title "mount-rs $package_version CLI preview" \
              --notes "$notes" \
              --prerelease \
              --verify-tag
          fi

          verification_dir="$RUNNER_TEMP/mount-rs-cli-release-verify"
          mkdir -p "$verification_dir"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$artifact" \
            --pattern SHA256SUMS \
            --pattern "$manifest" \
            --pattern "$sbom" \
            --dir "$verification_dir" \
            --clobber
          (cd "$verification_dir" && shasum -a 256 -c SHA256SUMS)
          node scripts/verify-w08-release-manifest.mjs \
            "$verification_dir/$manifest" \
            "$verification_dir/$artifact"
          node scripts/verify-w08-release-sbom.mjs \
            --sbom "$verification_dir/$sbom" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$release_commit" \
            --package mount-rs-cli \
            --version "$package_version" \
            --artifact "$verification_dir/$artifact"
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/cli-release.yml"
          common_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$signer_workflow"
            --source-digest "$release_commit"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify "$verification_dir/$artifact" "${common_args[@]}"
          gh attestation verify "$verification_dir/$artifact" \
            "${common_args[@]}" \
            --predicate-type https://cyclonedx.org/bom
          test "$(tar -tzf "$verification_dir/$artifact")" = "mount-rs"
          extracted_dir="$verification_dir/extracted"
          mkdir -p "$extracted_dir"
          tar -xzf "$verification_dir/$artifact" -C "$extracted_dir"
          test "$("$extracted_dir/mount-rs" --version)" = "mount-rs $package_version"
