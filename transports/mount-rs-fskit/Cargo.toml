[package]
name = "mount-rs-fskit-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bounded wire protocol and delegate boundary for the mount-rs FSKit worker"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
mount-rs-core = { path = "../.." }
mount-rs-host = { path = "../../filesystems/mount-rs-host" }
mount-rs-sqlite = { path = "../../providers/mount-rs-sqlite" }
mount-rs-sqlite-fs = { path = "../../filesystems/mount-rs-sqlite-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Keep this native bridge independently buildable; it is intentionally not a
# member of the root mount-rs Cargo workspace.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
