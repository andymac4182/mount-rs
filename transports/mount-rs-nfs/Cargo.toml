[package]
name = "mount-rs-nfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "NFSv3 and MOUNTv3 transport for mount-rs"
license = "Apache-2.0"

[dependencies]
mount-rs-core = { path = "../.." }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
mount-rs-memory = { path = "../../providers/mount-rs-memory" }
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
mount-rs-host = { path = "../../filesystems/mount-rs-host" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
