[package]
name = "mount-rs-s3"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Path-style S3 gateway transport for mount-rs filesystem drivers"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
hmac = "0.12"
md-5 = "0.10"
mount-rs-core = { path = "../.." }
percent-encoding = "2"
quick-xml = { version = "0.38", default-features = false, features = ["serialize"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
mount-rs-memfs = { path = "../../filesystems/mount-rs-memfs" }
async-trait = "0.1"
socket2 = "0.6"
