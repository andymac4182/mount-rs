[package]
name = "mount-rs-memfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "In-memory filesystem driver for mount-rs"
license = "Apache-2.0"
repository = "https://github.com/andymac4182/mount-rs"
readme = "README.md"
keywords = ["filesystem", "memfs", "mount"]

[dependencies]
async-trait = "0.1"
mount-rs-core = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
