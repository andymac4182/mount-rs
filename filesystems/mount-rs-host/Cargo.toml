[package]
name = "mount-rs-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rooted host-filesystem driver for mount-rs"
license = "Apache-2.0"

[dependencies]
arc-swap = "1.9"
im = "15.1"
async-trait = "0.1"
sha2 = "0.10"
tempfile = "3"
mount-rs-core = { path = "../.." }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
