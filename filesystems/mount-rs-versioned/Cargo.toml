[package]
name = "mount-rs-versioned"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Versioned filesystem coordination and immutable historical views for mount-rs"
repository = "https://github.com/andymac4182/mount-rs"

[dependencies]
mount-rs-core = { path = "../.." }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
mount-rs-memory = { path = "../../providers/mount-rs-memory" }
mount-rs-sqlite = { path = "../../providers/mount-rs-sqlite" }
mount-rs-chunked = { path = "../mount-rs-chunked" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
