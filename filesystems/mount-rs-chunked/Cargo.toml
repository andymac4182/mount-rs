[package]
name = "mount-rs-chunked"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Split metadata/block chunked filesystem orchestration for mount-rs"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
async-io = "2.6"
mount-rs-core = { path = "../.." }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
mount-rs-sqlite = { path = "../../providers/mount-rs-sqlite" }
serde_json = "1"
futures-lite = "2"
mount-rs-memory = { path = "../../providers/mount-rs-memory" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
