[package]
name = "mount-rs-rustfs-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
mount-rs-core = { path = "../.." }
mount-rs-pglite = { path = "../../providers/mount-rs-pglite" }
mount-rs-rustfs = { path = "../../providers/mount-rs-rustfs" }
mount-rs-sdk = { path = "../../crates/mount-rs-sdk" }
mount-rs-sqlite = { path = "../../providers/mount-rs-sqlite" }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
