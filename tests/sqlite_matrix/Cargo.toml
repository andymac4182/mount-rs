[workspace]

[package]
name = "mount-rs-sqlite-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
mount-rs-chunked = { path = "../../filesystems/mount-rs-chunked" }
mount-rs-core = { path = "../.." }
mount-rs-fault-injection = { path = "../../crates/mount-rs-fault-injection" }
mount-rs-sqlite = { path = "../../providers/mount-rs-sqlite" }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
